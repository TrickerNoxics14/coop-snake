  cfg = validCfg({ ...cfg, game: g, play: 'coop', mode: 'walls', board: 'medium', apples: 2, speed: 'normal' });
  skins = startingSkins(); fixClash();
  state = 'ready'; reset(); applySkins();
  showOverlay("📅 Today's game", `<b>${GAME_NAMES[g]}</b> — ${GAMES[g]}<br>Everyone gets this same game today.<br>Today's best: <b>${dailyBestOf()}</b>`, 'Play');
});
$('hostBtn').addEventListener('click', () => hostGame(false));
$('hostPubBtn').addEventListener('click', () => hostGame(true));
// "2 players on this keyboard"
$('twoBox').addEventListener('change', e => {
  e.currentTarget.blur(); // so the keys steer again
  wantTwo = e.currentTarget.checked;
  if (role === 'host') hostSetTwo(0, wantTwo, savedSkins.online2);
  else if (role === 'guest' && connected()) send({ t:'two', on: wantTwo, c: savedSkins.online2.c, p: savedSkins.online2.p });
  renderMenu();
});
$('joinBtn').addEventListener('click', () => joinGame($('codeIn').value));
$('leaveBtn').addEventListener('click', () => leaveOnline(''));

// The guest measures the connection delay every couple of seconds and shares it with the host
// (now done in heartbeat(), which runs on the worker timer so a hidden tab can't slow it down)

// Host → guest: full game snapshot every tick, plus the effects that happened
function sendState() {
  if (role !== 'host' || !connected()) { outFx = []; return; }
  const m = {
    t:'state', n: tickNo, state, cfg, score, apples, rocks, portals, tk: TICK, stats, skins, pausedT, pub: publicRoom,
    ch: challenge, goal, el: elapsed, g: G, statues, bw: bossWave, bn: bossNext,
    boss: boss && { kind: boss.kind, body: boss.body, dir: boss.dir, hp: boss.hp, max: boss.max, stun: boss.stun,
      under: boss.under || 0, pop: boss.under > 0 ? boss.pop : null },
    countLeft: countEnd - performance.now(),
    snakes: snakes.map(s => ({ id:s.id, body:s.body, dir:s.dir, queue:s.queue, alive:s.alive, respawn:s.respawn,
      apples:s.apples, pending:s.pending, eatFx:s.eatFx, log:s.log, moves:s.moves, gone:!!s.gone,
      shield:!!s.shield, safe:s.safe || 0, hl: Math.round(s.hl ?? HUNGER_MS),
      power: s.power || null, pw: Math.max(0, Math.round((s.pwEnd || 0) - elapsed)) })),
    fx: outFx,
  };
  // Each friend also hears which player they are and which of their key presses have arrived
  for (const [slot, c] of Object.entries(conns)) sendTo(c, { ...m, you: +slot, you2: seat2[slot] ?? -1, ack: lastSeq[slot] || 0 });
  outFx = [];
}

// Everything from the guest is untrusted: accept only well-formed messages
const pingSeen = {}, twoSeen = {};
function onHostData(slot, m) {
  if (!m || typeof m !== 'object') return;
  switch (m.t) {
    case 'input': {
      if (!has(DIRS, m.dir) || !Number.isSafeInteger(m.seq)) return;
      lastSeq[slot] = Math.max(lastSeq[slot] || 0, m.seq);
      // `who` = which of that computer's players (1 = their second player on the same keyboard)
      const target = m.who === 1 ? seat2[slot] : slot;
      if (target === undefined) return;
      // `at` = the move the friend meant to turn on, based on what their screen showed
      const at = Number.isSafeInteger(m.at) ? m.at : tickNo + 1;
      if (state === 'playing' && at <= tickNo && lateTurn(target, m.dir, at)) return;
      const s = snakeOf(target);
      if (state === 'ready' || state === 'over') { if (!publicRoom) steer(target, m.dir); } // (a key press in the menu starts the game)
      else if ((state === 'playing' || state === 'countdown') && s && s.alive)
        queueAt(s, m.dir, Math.min(at, tickNo + 3), tickNo);
      break;
    }
    // In a public room only the host starts, pauses and ends games (so a stranger can't spoil it for everyone)
    case 'space': if (publicRoom) return; spaceAction(); break;
    case 'start':
      if (publicRoom) return;
      if (state === 'paused') resume();
      else if (state === 'ready' || (state === 'over' && canRestart())) beginGame();
      break;
    case 'quit': if (publicRoom) return; endGame(); break;
    case 'skin': {
      const target = m.who === 1 ? seat2[slot] : slot;
      if (target === undefined) return;
      skins[target] = validSkin(m, skins[target]); fixClash(); applySkins(); sendState();
      break;
    }
    case 'emote': {
      // show it here and pass it on to the other friends
      const target = m.who === 1 ? seat2[slot] : slot;
      if (target !== undefined && isIdx(m.i, EMOTES.length) && showEmote(target, m.i)) send({ t:'emote', p:target, i:m.i }, slot);
      break;
    }
    case 'two': { // (at most once a second, so it can't be used to keep resetting the menu)
      const now = performance.now();
      if (now - (twoSeen[slot] || 0) < 1000) return;
      twoSeen[slot] = now;
      hostSetTwo(slot, m.on === true, m);
      break;
    }
    case 'ping': {
      const now = performance.now();
      if (!Number.isFinite(m.ts) || now - (pingSeen[slot] || 0) < 300) return;
      pingSeen[slot] = now;
      if (Number.isFinite(m.rtt) && m.rtt >= 0 && m.rtt < 60000) { pings[slot] = Math.round(m.rtt); renderPing(); }
      sendTo(conns[slot], { t:'pong', ts: m.ts });
      break;
    }
  }
}

// Guest: show the turn right away, then tell the host which move it was meant for
function guestSteer(dir, who = 0) {
  if (!connected()) return;
  const s = snakeOf(who ? mySlot2 : mySlot), live = state === 'playing' || state === 'countdown';
  let at = lastN + 1;
  if (live) {
    if (!s || !s.alive) return; // (no snake = watching until the next round)
    at = turnMove(s, lastN);
    if (!queueAt(s, dir, at, lastN)) return; // same or opposite way: nothing would change
  }
  const seq = ++inputSeq;
  unacked.push({ seq, dir, at, who });
  if (unacked.length > 8) unacked.shift();
  send({ t:'input', dir, seq, at, who });
}

// Everything from the host is untrusted too: rebuild the state from checked values only
const STATES = ['ready', 'countdown', 'playing', 'paused', 'over'];
const HEX = /^#[0-9a-f]{6}$/i;
const dirOr = (d, dflt) => has(DIRS, d) ? d : dflt;

function cleanState(m) {
  try {
    const c = validCfg(m.cfg);
    const [cols, rows] = BOARDS[c.board], cells = cols * rows;
    const cellOf = p => ({ x: int(p && p.x, 0, cols - 1), y: int(p && p.y, 0, rows - 1) });
    // a rock that's part of a player's statue remembers whose (for its color)
    const statueCell = p => {
      const o = cellOf(p);
      if (p && isIdx(p.statue, MAX_PLAYERS)) o.statue = p.statue;
      else if (p && Number.isFinite(p.slime)) { o.slime = int(p.slime, 1, 200); if (p.bomb === true) o.bomb = true; } // a boss's slime puddle or bomb
      else if (p && p.wall === true) o.wall = true; // a Squeeze wall
      return o;
    };
    const list = arr(m.snakes, MAX_PLAYERS);
    if (!list.length) return null;
    // every snake needs its own player slot 0–3
    const ids = list.map(s => s && s.id);
    if (!ids.every(i => isIdx(i, MAX_PLAYERS)) || new Set(ids).size !== ids.length) return null;
    const st = m.stats && typeof m.stats === 'object' ? m.stats : {};
    return {
      cfg: c,
      n: int(m.n, 0, 1e9),
      state: STATES.includes(m.state) ? m.state : 'ready',
      score: int(m.score, 0, 1e6),
      pausedT: num(m.pausedT, 0, 1),
      countLeft: num(m.countLeft, 0, 5000),
      ack: int(m.ack, 0, Number.MAX_SAFE_INTEGER),
      pub: m.pub === true,
      you: isIdx(m.you, MAX_PLAYERS) && m.you > 0 ? m.you : 1,
      you2: isIdx(m.you2, MAX_PLAYERS) && m.you2 > 0 && m.you2 !== m.you ? m.you2 : -1,
      apples: arr(m.apples, 64).map(a => { // (up to 20 apples, 20 poison ones, plus gold/key/shield)
        const o = cellOf(a);
        if (a && a.gold) { o.gold = true; o.max = int(a.max, 1, 1000); o.ttl = int(a.ttl, 0, o.max); }
        else if (a && a.poison === true) o.poison = true;
        else if (a && a.key === true) o.key = true;
        else if (a && a.shield === true) o.shield = true;
        else if (a && has(POWER_KINDS, a.power)) o.power = a.power;
        else if (a && a.locked === true) o.locked = true;
        return o;
      }),
      rocks: arr(m.rocks, cells).map(statueCell),
      statues: arr(m.statues, cells).map(statueCell),
      g: has(GAMES, m.g) && m.g !== 'blender' ? m.g : (c.game === 'blender' ? 'classic' : c.game),
      bw: int(m.bw, 0, 1e4), bn: int(m.bn, 0, 1000),
      boss: m.boss && typeof m.boss === 'object' && has(BOSSES, m.boss.kind) && arr(m.boss.body, 40).length ? {
        kind: m.boss.kind, body: arr(m.boss.body, 40).map(cellOf), dir: dirOr(m.boss.dir, 'left'),
        max: int(m.boss.max, 1, 99), hp: int(m.boss.hp, 0, 99), stun: int(m.boss.stun, 0, 30), grow: 0, wait: 0,
        under: int(m.boss.under, 0, 50), pop: m.boss.pop ? cellOf(m.boss.pop) : null,
      } : null,
      portals: arr(m.portals, 4).length === 4 ? m.portals.map(cellOf) : [],
      tk: num(m.tk, 40, 400, SPEEDS[c.speed]),
      ch: has(CHALLENGES, m.ch) ? m.ch : 'apples',
      goal: [0, 1, 2].map(i => int(arr(m.goal, 3)[i], 1, 1e4)),
      el: num(m.el, 0, 1e7),
      skins: DEFAULT_SKINS.map((d, i) => validSkin(arr(m.skins, MAX_PLAYERS)[i], d)),
      stats: { rescues: int(st.rescues, 0, 1e6), teamwork: int(st.teamwork, 0, 1e6), longest: int(st.longest, 0, cells), ch: int(st.ch, 0, 1e6), bosses: int(st.bosses, 0, 1e4) },
      snakes: list.map(s => {
        const body = arr(s.body, cells).map(cellOf);
        if (!body.length) throw new Error('bad body');
        return {
          id: s.id, body, gone: s.gone === true, dir: dirOr(s.dir, 'right'), queue: arr(s.queue, 3).filter(d => has(DIRS, d)),
          alive: s.alive === true, respawn: int(s.respawn, 0, 1000), apples: int(s.apples, 0, 1e6),
          pending: int(s.pending, 0, 100), eatFx: num(s.eatFx, 0, 1), moves: int(s.moves, 0, 1e9),
          shield: s.shield === true, safe: int(s.safe, 0, 100), hl: int(s.hl, 0, HUNGER_MS),
          power: has(POWER_KINDS, s.power) ? s.power : null, pw: int(s.pw, 0, 60000),
          log: arr(s.log, 8).map(r => r && typeof r === 'object'
            ? { tail: r.tail ? cellOf(r.tail) : null, turn: r.turn === true, ate: r.ate === true, ok: r.ok === true }
            : { tail: null, turn: false, ate: false, ok: false }),
        };
      }),
      fx: arr(m.fx, 60).filter(f => Array.isArray(f) && has(FX_SAFE, f[0]) && Array.isArray(f[1])),
    };
  } catch (e) { return null; } // ignore malformed messages
}

// Only these effects can be triggered by the host, with their arguments clamped
const posOf = p => ({ x: num(p && p.x, -1, COLS), y: num(p && p.y, -1, ROWS) });
const FX_SAFE = {
  beep: (f, d, delay, type) => beep(num(f, 40, 4000, 440), num(d, .01, .5), num(delay, 0, .5),
    ['square', 'sine', 'sawtooth', 'triangle'].includes(type) ? type : 'square'),
  burst: (p, color, n, speed) => burst(posOf(p), HEX.test(color) ? color : '#ffffff', int(n, 0, 30), num(speed, 0, 6)),
  popup: (p, text, color) => popup(posOf(p), String(text).slice(0, 12), HEX.test(color) ? color : '#ffffff'),
  shake: () => doShake(),
  crunch: () => crunch(),
};

function setClock(t) { lastTick = t; applyAt = t + TICK; }

// Guest: play each step when the previous one has finished animating, so network jitter doesn't cause stutter
function pumpInbox() {
  while (inbox.length) {
    const m = inbox[0], now = performance.now();
    const isStep = state === 'playing' && m.n > lastN;
    if (isStep && now < applyAt - 2 && inbox.length < 3) break;
    inbox.shift();
    applyState(m);
    if (isStep && state === 'playing') {
      const onTime = now >= applyAt - 2 && now - applyAt <= 25;
      // A step that had to wait starts 1.5ms early, slowly draining any extra delay
      setClock(onTime ? applyAt - (applyAt - m.at > 10 ? 1.5 : 0) : now);
    }
  }
}

function applyState(m) {
  const prev = state, now = performance.now();
  if (m.pub !== roomPublic) { roomPublic = m.pub; renderMenu(); }
  challenge = m.ch; goal = m.goal; elapsed = m.el; statues = m.statues;
  boss = m.boss; bossWave = m.bw; bossNext = m.bn;
  if (m.g !== G) { G = m.g; $('hint').textContent = hintText(); }
  if (JSON.stringify(m.cfg) !== JSON.stringify(cfg)) { cfg = m.cfg; applyConfig(); }
  state = m.state; score = m.score; apples = m.apples; rocks = m.rocks; stats = m.stats;
  portals = m.portals; TICK = m.tk;
  if (JSON.stringify(m.skins) !== JSON.stringify(skins)) { skins = m.skins; applySkins(); }
  snakes = m.snakes; tickNo = m.n; lastN = m.n;
  for (const s of snakes) s.pwEnd = elapsed + (s.pw || 0); // (power-up time left, measured on this screen)
  if (m.you !== mySlot) { mySlot = m.you; renderMenu(); }
  // Show my key presses the host hasn't confirmed yet, exactly the way the host will apply them
  if (m.you2 !== mySlot2) { mySlot2 = m.you2; renderMenu(); }
  unacked = unacked.filter(u => u.seq > m.ack);
  if (state === 'playing' || state === 'countdown') for (const u of unacked) {
    const mine = snakeOf(u.who ? mySlot2 : mySlot);
    if (!mine || !mine.alive) continue;
    const r = state === 'playing' && u.at <= m.n ? replayTurn(mine, m.n - u.at + 1, u.dir) : null;
    if (r) { mine.body = r.body; mine.dir = u.dir; mine.log = r.log; }
    else queueAt(mine, u.dir, u.at, m.n);
  }
  if (state === 'countdown') countEnd = now + m.countLeft;
  if (state === 'paused') pausedT = m.pausedT;
  if (state === 'countdown' && prev !== 'countdown') { particles = []; popups = []; lastCount = 0; bestAtStart = best; rockBorn.clear(); }
  if (state === 'playing' && prev !== 'playing') setClock(now - (prev === 'paused' ? m.pausedT * TICK : 0));
  if (state === 'over' && prev !== 'over') overAt = now;
  for (const [name, args] of m.fx) FX_SAFE[name](...args);
  updateHud();
  if (state !== prev || forceOverlay) {
    forceOverlay = false;
    if (state === 'countdown' || state === 'playing') overlay.classList.add('hidden');
    else if (state === 'paused') showOverlay('Paused', 'Press Space to resume', 'Resume', true);
    else if (state === 'over') showGameOver();
    else showIntro();
  }
}

// ---------- Sound ----------
let audio;
// Browsers keep sound locked until you click or press a key on the page. If the first sound came
// from the network (the host starting the game), it stayed locked, so unlock it on the next key/click.
const unlockAudio = () => { if (audio && audio.state === 'suspended') audio.resume().catch(() => {}); };
addEventListener('keydown', unlockAudio);
addEventListener('pointerdown', unlockAudio);

function beep(freq, dur, delay = 0, type = 'square') {
  if (recording) outFx.push(['beep', [freq, dur, delay, type]]);
  if (muted) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume().catch(() => {});
    const t = audio.currentTime + delay, o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(.06, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}

// A short "crunch" (filtered noise), like biting an apple in Google's snake
let noiseBuf = null;
function crunch() {
  if (recording) outFx.push(['crunch', []]);
  if (muted) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (!noiseBuf) {
      noiseBuf = audio.createBuffer(1, audio.sampleRate * .12, audio.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
    }
    const src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
    src.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = 1800 + Math.random() * 600; f.Q.value = .8;
    g.gain.value = .35;
    src.connect(f).connect(g).connect(audio.destination); src.start();
  } catch (e) {}
}

// ---------- Music: a short looping chiptune that speeds up as your score grows ----------
let musicOn = true;
try { musicOn = localStorage.getItem('coopSnakeMusic') !== '0'; } catch (e) {}
const TUNE = [523,0,659,0,784,0,659,0, 587,0,698,0,880,0,698,0, 523,0,659,0,988,0,784,0, 659,0,784,0,523,0,0,0];
const BASS = [131,131,165,165,147,147,196,196];
let mus = null;
function tone(f, t, dur, type, vol) {
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur + .02);
}
function musicTick() {
  if (!audio || !mus || !musicOn || muted || state === 'paused') return;
  if (state !== 'playing' && state !== 'countdown') return; // the music rests between games
  const step = 60 / Math.min(170, 104 + score * 1.2) / 2;
  if (mus.next < audio.currentTime) mus.next = audio.currentTime + .05; // (coming back after a pause)
  while (mus.next < audio.currentTime + .2) {
    const i = mus.step, f = TUNE[i % TUNE.length];
    if (f) tone(f, mus.next, step * .9, 'triangle', .035);
    if (i % 4 === 0) tone(BASS[(i / 4 | 0) % BASS.length], mus.next, step * 3.5, 'sine', .05);
    mus.next += step; mus.step++;
  }
}
function musicStart() {
  if (mus || !musicOn) return;
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  mus = { next: audio.currentTime + .05, step: 0 };
  setInterval(musicTick, 50);
}
function toggleMusic() {
  musicOn = !musicOn;
  try { localStorage.setItem('coopSnakeMusic', musicOn ? '1' : '0'); } catch (e) {}
  $('musicBtn').style.opacity = musicOn ? 1 : .4;
  if (musicOn) musicStart();
}
$('musicBtn').addEventListener('click', e => { e.currentTarget.blur(); toggleMusic(); });
$('musicBtn').style.opacity = musicOn ? 1 : .4;

// ---------- Effects ----------
function burst(cell, color, n, speed) {
  if (recording) outFx.push(['burst', [{ x:cell.x, y:cell.y }, color, n, speed]]);
  // bigger bursts (eating, crashing, coming back) also send out a ring
  if (n >= 12) waves.push({ x:(cell.x + .5) * CELL, y:(cell.y + .5) * CELL, color, life:1 });
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), v = rand(.3, 1) * speed;
    particles.push({ x:(cell.x + .5) * CELL, y:(cell.y + .5) * CELL, vx:Math.cos(a) * v, vy:Math.sin(a) * v,
      life:1, decay:rand(.02, .045), r:CELL * rand(.05, .11), color });
  }
}
function popup(cell, text, color) {
  if (recording) outFx.push(['popup', [{ x:cell.x, y:cell.y }, text, color]]);
  popups.push({ x:(cell.x + .5) * CELL, y:(cell.y + .2) * CELL, text, color, life:1 });
}
function doShake() {
  if (recording) outFx.push(['shake', []]);
  shake = 1;
}

// ---------- Rendering ----------
function drawBoard() {
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    ctx.fillStyle = (x + y) % 2 ? DARK : LIGHT;
    ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
  }
}

// Statue squares: grey stone tinted with the snake's color. `ghost` = not solid yet (a snake is still on it).
function drawStatue(r, now, ghost) {
  const key = 's' + r.x + ',' + r.y;
  if (!ghost && !rockBorn.has(key)) rockBorn.set(key, now);
  const t = ghost ? 1 : Math.min(1, (now - rockBorn.get(key)) / 250);
  const x = r.x * CELL, y = r.y * CELL, pad = CELL * (.12 + .1 * (1 - t));
  const stone = mix(skinHex(r.statue), '#9aa0a8', .7);
  ctx.globalAlpha = ghost ? .3 : 1;
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.fillRect(x + pad, y + pad + CELL * .06, CELL - pad * 2, CELL - pad * 2);
  ctx.fillStyle = stone;
  ctx.fillRect(x + pad, y + pad, CELL - pad * 2, CELL - pad * 2);
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.fillRect(x + pad, y + pad, CELL - pad * 2, CELL * .08);
  ctx.globalAlpha = 1;
}

// A boss's slime: a bubbling green puddle that fades away as it dries up
function drawSlime(r, now) {
  if (r.bomb) { // a Bomber's bomb: a dark ball with a fizzing fuse (it blinks faster as it gets close to going off)
    const cx = (r.x + .5) * CELL, cy = (r.y + .5) * CELL, blink = r.slime < 8 && Math.floor(now / 120) % 2;
    ctx.fillStyle = blink ? '#ff5a3c' : '#2b2b2b';
    ctx.beginPath(); ctx.arc(cx, cy + CELL * .05, CELL * .32, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#888'; ctx.lineWidth = CELL * .05;
    ctx.beginPath(); ctx.moveTo(cx + CELL * .2, cy - CELL * .22); ctx.quadraticCurveTo(cx + CELL * .4, cy - CELL * .45, cx + CELL * .3, cy - CELL * .4); ctx.stroke();
    return;
  }
  const cx = (r.x + .5) * CELL, cy = (r.y + .5) * CELL, a = Math.min(1, r.slime / 12);
  ctx.globalAlpha = .85 * a;
  ctx.fillStyle = '#7cf06a'; ctx.strokeStyle = '#1d6b28'; ctx.lineWidth = CELL * .07; // (outlined so it stands out on the grass)
  ctx.beginPath(); ctx.ellipse(cx, cy, CELL * .44, CELL * .36, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#2f9e3a';
  ctx.beginPath(); ctx.ellipse(cx + CELL * .08, cy + CELL * .06, CELL * .26, CELL * .2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)'; // little bubbles
  for (let k = 0; k < 2; k++) {
    const b = (now / 600 + k * .5 + r.x * .3) % 1;
    ctx.beginPath(); ctx.arc(cx - CELL * .15 + k * CELL * .25, cy - b * CELL * .2, CELL * .05 * (1 - b), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// A Squeeze wall: a solid dark block with a lighter edge
function drawWall(r) {
  const x = r.x * CELL, y = r.y * CELL;
  ctx.fillStyle = '#4b4f57'; ctx.fillRect(x, y, CELL, CELL);
  ctx.fillStyle = '#656a73'; ctx.fillRect(x + 2, y + 2, CELL - 4, CELL * .22);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x + 2, y + CELL * .72, CELL - 4, CELL * .26);
}

function drawRock(r, now) {
  if (r.wall) return drawWall(r);
  if (r.slime !== undefined) return drawSlime(r, now);
  if (r.statue !== undefined) return drawStatue(r, now, false);
  const key = r.x + ',' + r.y;
  if (!rockBorn.has(key)) rockBorn.set(key, now);
  const a = Math.min(1, (now - rockBorn.get(key)) / 280), u = a - 1;
  const s = CELL * .42 * (1 + 2.7 * u * u * u + 1.7 * u * u); // pops in with a little overshoot
  if (s <= 0) return;
  const cx = (r.x + .5) * CELL, cy = (r.y + .5) * CELL;
  ctx.fillStyle = 'rgba(0,0,0,.15)';
  ctx.beginPath(); ctx.ellipse(cx, cy + s * .75, s * .95, s * .3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#7b818a';
  ctx.beginPath();
  ctx.moveTo(cx - s * .9, cy + s * .5);
  ctx.quadraticCurveTo(cx - s, cy - s * .5, cx - s * .3, cy - s * .85);
  ctx.quadraticCurveTo(cx + s * .5, cy - s * 1.05, cx + s * .9, cy - s * .3);
  ctx.quadraticCurveTo(cx + s * 1.05, cy + s * .5, cx + s * .5, cy + s * .75);
  ctx.quadraticCurveTo(cx - s * .2, cy + s * .95, cx - s * .9, cy + s * .5);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  ctx.beginPath(); ctx.ellipse(cx - s * .3, cy - s * .4, s * .35, s * .18, -.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = CELL * .035; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx + s * .15, cy - s * .1); ctx.lineTo(cx + s * .45, cy + s * .25); ctx.stroke();
}

// Apples pop in when they appear and bob gently; golden ones sparkle
function drawApple(a, now) {
  const key = a.x + ',' + a.y + (a.poison ? 'p' : a.gold ? 'g' : a.key ? 'k' : '');
  // (in Magnet mode apples move around all the time, so they don't pop in again at every step)
  if (!appleBorn.has(key)) { if (appleBorn.size > 300) appleBorn.clear(); appleBorn.set(key, (G === 'magnet' || G === 'runaway') && !a.gold ? now - 1e4 : now); }
  const t = Math.min(1, (now - appleBorn.get(key)) / 320), u = t - 1;
  const pop = 1 + 2.7 * u * u * u + 1.7 * u * u;
  if (pop <= 0) return;
  const cx = (a.x + .5) * CELL, cy = (a.y + .5) * CELL, bob = Math.sin(now / 420 + a.x * 1.7 + a.y) * CELL * .035;
  ctx.save();
  ctx.translate(cx, cy + bob); ctx.scale(pop, pop); ctx.translate(-cx, -cy);
  drawAppleShape(a, now);
  if (a.gold) {
    for (let k = 0; k < 3; k++) {
      const ang = now / 520 + k * 2.09, tw = .5 + .5 * Math.sin(now / 130 + k * 2);
      const sx = cx + Math.cos(ang) * CELL * .55, sy = cy + Math.sin(ang) * CELL * .55, r = CELL * .07 * (.5 + tw);
      ctx.fillStyle = `rgba(255,248,200,${.5 + .5 * tw})`;
      ctx.beginPath(); // four-point twinkle
      ctx.moveTo(sx, sy - r * 2); ctx.lineTo(sx + r * .5, sy - r * .5); ctx.lineTo(sx + r * 2, sy); ctx.lineTo(sx + r * .5, sy + r * .5);
      ctx.lineTo(sx, sy + r * 2); ctx.lineTo(sx - r * .5, sy + r * .5); ctx.lineTo(sx - r * 2, sy); ctx.lineTo(sx - r * .5, sy - r * .5);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawAppleShape(a, now) {
  if (a.gold && a.ttl < 16 && Math.floor(now / 110) % 2) return; // blink before vanishing
  const cx = (a.x + .5) * CELL, cy = (a.y + .55) * CELL;
  if (a.key) return drawKey(cx, (a.y + .5) * CELL, now);
  if (a.shield) return drawShield(cx, (a.y + .5) * CELL, CELL * .34, now);
  if (a.power) { // a glowing bubble with the power-up's symbol inside, bobbing a little
    const py = (a.y + .5) * CELL + Math.sin(now / 260) * CELL * .05, c = POWER_KINDS[a.power].color;
    const g = ctx.createRadialGradient(cx, py, CELL * .1, cx, py, CELL * .6);
    g.addColorStop(0, c + 'cc'); g.addColorStop(1, c + '00');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, py, CELL * .6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, py, CELL * .3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = c; ctx.lineWidth = CELL * .07; ctx.stroke();
    ctx.font = `${CELL * .3}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#222'; ctx.fillText({ magnet:'🧲', double:'2×', ghost:'👻' }[a.power], cx, py + CELL * .02);
    return;
  }
  if (a.locked) { // the apple, inside a cage
    drawAppleShape({ x:a.x, y:a.y }, now);
    const x = a.x * CELL + CELL * .08, y = a.y * CELL + CELL * .08, w = CELL * .84;
    ctx.strokeStyle = '#5b4a3a'; ctx.lineWidth = CELL * .07; ctx.lineCap = 'butt';
    ctx.strokeRect(x, y, w, w);
    ctx.lineWidth = CELL * .045;
    ctx.beginPath();
    for (let i = 1; i < 4; i++) { ctx.moveTo(x + w * i / 4, y); ctx.lineTo(x + w * i / 4, y + w); }
    ctx.stroke();
    ctx.fillStyle = '#ffcc33'; // little padlock
    ctx.fillRect(x + w / 2 - CELL * .1, y + w - CELL * .16, CELL * .2, CELL * .16);
    return;
  }
  const r = CELL * .43 * (1 + Math.sin(now / (a.gold ? 120 : 250)) * (a.gold ? .07 : .03));
  if (a.gold) {
    const g = ctx.createRadialGradient(cx, cy, r * .5, cx, cy, r * 2);
    g.addColorStop(0, 'rgba(255,230,120,.6)'); g.addColorStop(1, 'rgba(255,230,120,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r * 2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  ctx.beginPath(); ctx.ellipse(cx, cy + r * .9, r * .8, r * .25, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = a.gold ? '#f5c518' : a.poison ? '#3b1352' : '#e7471d';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = a.poison ? 'rgba(190,255,120,.35)' : 'rgba(255,255,255,.4)';
  ctx.beginPath(); ctx.arc(cx - r * .35, cy - r * .3, r * .22, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#6b3e1f'; ctx.lineWidth = CELL * .07; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, cy - r * .8); ctx.lineTo(cx + r * .1, cy - r * 1.3); ctx.stroke();
  ctx.fillStyle = a.poison ? '#7bc043' : '#4caf50';
  ctx.beginPath(); ctx.ellipse(cx + r * .45, cy - r * 1.1, r * .38, r * .18, -.5, 0, Math.PI * 2); ctx.fill();
  if (a.poison) { // skull, so it can't be mistaken for food
    ctx.fillStyle = '#d9ffb0'; ctx.font = `${CELL * .36}px "Segoe UI Symbol", "Apple Color Emoji", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('☠', cx, cy + CELL * .02);
  }
  if (a.gold) { // timer ring
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = CELL * .05;
    ctx.beginPath(); ctx.arc(cx, cy, r * 1.35, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * a.ttl / a.max); ctx.stroke();
  }
}

// A glowing blue shield badge
function drawShield(cx, cy, r, now) {
  const g = ctx.createRadialGradient(cx, cy, r * .3, cx, cy, r * 1.7);
  g.addColorStop(0, 'rgba(127,212,255,.6)'); g.addColorStop(1, 'rgba(127,212,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r * 1.7, 0, Math.PI * 2); ctx.fill();
  const y = cy + Math.sin(now / 300) * r * .06;
  ctx.beginPath();
  ctx.moveTo(cx, y - r);
  ctx.quadraticCurveTo(cx + r * .55, y - r * .7, cx + r * .9, y - r * .75);
  ctx.quadraticCurveTo(cx + r * .9, y + r * .45, cx, y + r * 1.05);
  ctx.quadraticCurveTo(cx - r * .9, y + r * .45, cx - r * .9, y - r * .75);
  ctx.quadraticCurveTo(cx - r * .55, y - r * .7, cx, y - r);
  ctx.fillStyle = '#2f8fe0'; ctx.fill();
  ctx.lineWidth = r * .16; ctx.strokeStyle = '#d8f1ff'; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  ctx.beginPath(); ctx.ellipse(cx - r * .3, y - r * .3, r * .18, r * .38, .3, 0, Math.PI * 2); ctx.fill();
}

// A golden key that slowly swings
function drawKey(cx, cy, now) {
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(-.6 + Math.sin(now / 300) * .2);
  const g = ctx.createRadialGradient(0, 0, CELL * .1, 0, 0, CELL * .55);
  g.addColorStop(0, 'rgba(255,230,120,.55)'); g.addColorStop(1, 'rgba(255,230,120,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, CELL * .55, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#f5c518'; ctx.fillStyle = '#f5c518'; ctx.lineWidth = CELL * .09; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(-CELL * .17, 0, CELL * .13, 0, Math.PI * 2); ctx.stroke(); // ring
  ctx.beginPath(); ctx.moveTo(-CELL * .04, 0); ctx.lineTo(CELL * .3, 0);              // shaft
  ctx.moveTo(CELL * .2, 0); ctx.lineTo(CELL * .2, CELL * .11);                        // teeth
  ctx.moveTo(CELL * .29, 0); ctx.lineTo(CELL * .29, CELL * .09);
  ctx.stroke();
  ctx.restore();
}

// Portals: swirling rings, each pair in its own color
// (the dark hole goes under the snakes, the spinning ring over them, so a snake looks like it's going in)
function drawPortals(now, rings) {
  portals.forEach((p, i) => {
    const cx = (p.x + .5) * CELL, cy = (p.y + .5) * CELL, color = PORTAL_COLORS[i >> 1];
    if (!rings) {
      const g = ctx.createRadialGradient(cx, cy, CELL * .05, cx, cy, CELL * .48);
      g.addColorStop(0, '#1b1030'); g.addColorStop(.7, color + '99'); g.addColorStop(1, color + '00');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, CELL * .48, 0, Math.PI * 2); ctx.fill();
      return;
    }
    // dark outline so the ring shows up even on a snake of the same color
    ctx.strokeStyle = 'rgba(20,10,40,.55)'; ctx.lineWidth = CELL * .15;
    ctx.beginPath(); ctx.arc(cx, cy, CELL * .44, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = color; ctx.lineWidth = CELL * .08; ctx.lineCap = 'round';
    const spin = now / 300 * (i % 2 ? -1 : 1);
    for (let k = 0; k < 3; k++) {
      ctx.beginPath(); ctx.arc(cx, cy, CELL * .44, spin + k * 2.09, spin + k * 2.09 + 1.2); ctx.stroke();
    }
  });
}

const px = p => ({ x: (p.x + .5) * CELL, y: (p.y + .5) * CELL });
const nextDir = s => s.queue.length ? s.queue[0] : s.dir;

function drawSnake(s, t, now) {
  const b = s.body, n = b.length, L = looks[s.id];
  const dir = s.alive ? nextDir(s) : s.dir, d = DIRS[dir];
  const next = step(b[0], dir);
  // The tail only stays put on moves where the snake is growing (it grows the move after eating)
  const grow = s.pending > 0;
  // Don't slide the head into anything that's about to stop or kill it
  const tt = s.alive && (state === 'playing' || state === 'paused') && !aheadBlocked(s, dir) ? t : 0;

  // Draw ahead of the logical position so turns show the instant a key is pressed
  const pts = [toward(b[0], next, tt)];
  const keep = grow || tt === 0 ? n : n - 1;
  for (let i = 0; i < keep; i++) pts.push(b[i]);
  if (keep < n) pts.push(toward(b[n - 1], linkNext(b[n - 1], b[n - 2] || b[0]), tt));

  // A turn pressed mid-square would make the head snap sideways (it was already partway along the old way).
  // Instead, it glides from where it was onto the new line in a few frames, so turns are instant AND smooth.
  // (Same for any other sudden jump while the head is in the same square, e.g. stopping in front of a teammate.)
  const raw = pts[0];
  if (s.alive && L.lastB0 && eq(L.lastB0, b[0]) && L.lastHead) {
    const jump = Math.hypot(raw.x - L.lastRaw.x, raw.y - L.lastRaw.y) - Math.abs(tt - L.lastTT);
    if (jump > .05 && Math.abs(raw.x - L.lastHead.x) + Math.abs(raw.y - L.lastHead.y) < 1.5)
      L.glide = { x: L.lastHead.x - raw.x, y: L.lastHead.y - raw.y, at: now };
  } else if (!L.lastB0 || !s.alive) L.glide = null;
  if (L.glide) {
    const k = (now - L.glide.at) / GLIDE_MS;
    if (k >= 1 || !s.alive) L.glide = null;
    // (steady speed from the very first frame, so the turn shows straight away without a jump)
    else { const f = 1 - k; pts[0] = { x: raw.x + L.glide.x * f, y: raw.y + L.glide.y * f }; }
  }
  L.lastB0 = b[0]; L.lastRaw = raw; L.lastTT = tt; L.lastHead = pts[0];

  // Where the path wraps across an edge, run off that side and back in from the opposite one
  // (each point also carries k = how far along the body it is, so the tail can taper)
  const runs = [[{ ...pts[0], k:0 }]];
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], c = { ...pts[i], k:i };
    const gate = Number.isInteger(a.x) && Number.isInteger(a.y) ? portalAt(a) : -1;
    if (gate >= 0 && Math.hypot(a.x - c.x, a.y - c.y) > 1.01 && !(Number.isInteger(c.x) && touching(a, c))) {
      // Went through a portal: this part of the body starts at the entrance portal instead
      runs.push([{ ...portals[gate ^ 1], k:i - .5 }]);
    } else if (Math.abs(a.x - c.x) > 1.5 || Math.abs(a.y - c.y) > 1.5) {
      const w = toward(a, c, 1), dx = w.x - a.x, dy = w.y - a.y;
      runs[runs.length - 1].push({ x: a.x + dx, y: a.y + dy, k:i - .5 });
      runs.push([{ x: c.x - dx, y: c.y - dy, k:i - .5 }]);
    }
    runs[runs.length - 1].push(c);
  }
  // A head sliding off one edge also pokes in from the opposite one
  const heads = [pts[0]];
  if (cfg.mode === 'wrap') {
    const hp = pts[0];
    const wx = hp.x > COLS - 1 ? hp.x - COLS : hp.x < 0 ? hp.x + COLS : hp.x;
    const wy = hp.y > ROWS - 1 ? hp.y - ROWS : hp.y < 0 ? hp.y + ROWS : hp.y;
    if (wx !== hp.x || wy !== hp.y) {
      heads.push({ x: wx, y: wy });
      runs.push([{ x: wx, y: wy, k:0 }, { x: wx - d.x, y: wy - d.y, k:1 }]);
    }
  }

  ctx.save();
  if (!s.alive) ctx.globalAlpha = .45 + .15 * Math.sin(now / 120);
  const sinceSpawn = now - (L.spawnAt || -1e9), sinceDeath = now - (L.dieAt || -1e9);
  if (s.alive && sinceSpawn < 450) ctx.globalAlpha = .2 + .8 * sinceSpawn / 450; // fades in when it appears
  if (s.alive && s.safe > 0) ctx.globalAlpha = .45 + .2 * Math.sin(now / 60); // see-through after using a shield
  if (s.alive && s.power === 'ghost') ctx.globalAlpha = .4 + .15 * Math.sin(now / 90); // Ghost power-up: see-through
  // Each body square keeps its own number (from when the head made it), so patterns stay put on the body
  const pattern = s.alive ? skins[s.id].p : 'classic';
  const hue = id => `hsl(${(id * 22 % 360 + 360) % 360}, 85%, 58%)`;
  const color = !s.alive ? skinDead(s.id) : pattern === 'rainbow' ? hue(s.moves + 1) : skinHex(s.id);
  ctx.strokeStyle = color; ctx.lineWidth = CELL * .78; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // Like Google's snake, the last few squares get thinner toward the tip of the tail
  const N = pts.length - 1, T = Math.min(5, N), full = CELL * .78;
  const widthAt = k => full * (1 - .42 * Math.max(0, (k - (N - T)) / T));
  const strokeRuns = () => {
    for (const run of runs) {
      const P = run.map(p => ({ ...px(p), k:p.k }));
      // the thick part as one smooth line, then the tapering tail piece by piece
      let i = 1;
      if (P[0].k <= N - T) {
        ctx.lineWidth = full;
        ctx.beginPath(); ctx.moveTo(P[0].x, P[0].y);
        for (; i < P.length && P[i].k <= N - T; i++) ctx.lineTo(P[i].x, P[i].y);
        if (i === 1) ctx.lineTo(P[0].x + .01, P[0].y);
        ctx.stroke();
      }
      for (let j = Math.max(1, i); j < P.length; j++) taperSeg(P[j - 1], P[j], P[j - 1].k, P[j].k);
    }
    ctx.lineWidth = full;
  };
  // One thinning piece of body: flat ends, plus a round joint exactly as wide as the body there (so no bumps)
  function taperSeg(A, C, ka, kc) {
    ctx.lineCap = 'butt'; ctx.lineWidth = widthAt((ka + kc) / 2);
    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(C.x, C.y); ctx.stroke();
    ctx.lineCap = 'round';
    ctx.fillStyle = ctx.strokeStyle;
    for (const [p, k] of [[A, ka], [C, kc]]) { ctx.beginPath(); ctx.arc(p.x, p.y, widthAt(k) / 2, 0, Math.PI * 2); ctx.fill(); }
  }
  strokeRuns();
  if (!s.alive && sinceDeath < 320) { // flashes white as it crashes
    const a = ctx.globalAlpha;
    ctx.globalAlpha = (1 - sinceDeath / 320) * .9; ctx.strokeStyle = '#ffffff';
    strokeRuns();
    ctx.globalAlpha = a; ctx.strokeStyle = color;
  }
  // Rainbow colors each piece by its square's number; Classic shades gently darker toward the tail, like Google's snake
  const shade = pattern === 'classic' && s.alive && ctx.globalAlpha === 1;
  if (pattern === 'rainbow' || shade) {
    for (let j = 0; j + 1 < pts.length; j++) {
      const a = pts[j], c = pts[j + 1];
      if (Math.abs(a.x - c.x) > 1.5 || Math.abs(a.y - c.y) > 1.5) continue;
      const A = px(a), C = px(c);
      ctx.strokeStyle = shade ? mix(color, '#1a2a6c', .32 * (j + .5) / N) : hue(s.moves - j);
      taperSeg(A, C, j, j + 1);
    }
  } else if (pattern !== 'classic') {
    const base = skinHex(s.id);
    for (let i = 1; i < keep; i++) {
      const c = px(b[i]), f = toward(b[i], linkNext(b[i], b[i - 1]), 1);
      const ux = f.x - b[i].x, uy = f.y - b[i].y, perpX = -uy * CELL, perpY = ux * CELL;
      const even = ((s.moves - i) & 1) === 0;
      if (pattern === 'stripes') {
        if (!even) continue;
        ctx.strokeStyle = mix(base, '#ffffff', .6); ctx.lineWidth = CELL * .36; ctx.lineCap = 'butt';
        ctx.beginPath(); ctx.moveTo(c.x - perpX * .37, c.y - perpY * .37); ctx.lineTo(c.x + perpX * .37, c.y + perpY * .37); ctx.stroke();
      } else {
        ctx.fillStyle = mix(base, '#000000', .42);
        const side = even ? .15 : -.15;
        ctx.beginPath(); ctx.arc(c.x + perpX * side, c.y + perpY * side, CELL * .13, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.lineCap = 'round';
  }

  const ang = Math.atan2(d.y, d.x), headR = CELL * .39 * (1 + .28 * s.eatFx);
  // Mouth opens when an apple is right ahead, like Google's snake
  let near = false;
  if (s.alive) for (let i = 0, p = b[0]; i < 2 && !near; i++) { p = step(p, dir); near = apples.some(a => !a.poison && !a.locked && eq(a, p)); }
  L.mouth += ((near ? 1 : 0) - L.mouth) * Math.min(1, .3 * frameK);
  // Eyes, with the occasional blink
  if (!L.blinkAt || now > L.blinkAt + 150) L.blinkAt = now + rand(2200, 5200);
  const blink = s.alive && now >= L.blinkAt && now <= L.blinkAt + 130;

  for (const hp of heads) {
    const h = px(hp);
    if (hp.x >= -.5 && hp.x <= COLS - .5 && hp.y >= -.5 && hp.y <= ROWS - .5) { L.hx = h.x; L.hy = h.y; }
    if (s.eatFx > 0) { // head bulge after eating
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(h.x, h.y, headR, 0, Math.PI * 2); ctx.fill();
    }
    if (L.mouth > .04) {
      const open = L.mouth * .7;
      ctx.fillStyle = '#3d1414';
      ctx.beginPath(); ctx.moveTo(h.x, h.y); ctx.arc(h.x, h.y, headR * .97, ang - open, ang + open); ctx.closePath(); ctx.fill();
    }
    // Every few seconds the tongue flicks out (each snake on its own rhythm)
    const flick = (now + s.id * 977) % 3400;
    if (s.alive && L.mouth < .1 && flick < 280) {
      const out = Math.sin(Math.PI * flick / 280), base = headR * .85, len = CELL * .32 * out;
      const tx = h.x + d.x * (base + len), ty = h.y + d.y * (base + len), fork = CELL * .08 * out;
      ctx.strokeStyle = '#e8364f'; ctx.lineWidth = CELL * .05; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(h.x + d.x * base, h.y + d.y * base); ctx.lineTo(tx, ty);
      ctx.moveTo(tx, ty); ctx.lineTo(tx + d.x * fork - d.y * fork, ty + d.y * fork + d.x * fork);
      ctx.moveTo(tx, ty); ctx.lineTo(tx + d.x * fork + d.y * fork, ty + d.y * fork - d.x * fork);
      ctx.stroke();
    }
    const back = CELL * (.12 - .07 * L.mouth);
    const fx = h.x + d.x * back, fy = h.y + d.y * back;
    const ox = -d.y * CELL * .2, oy = d.x * CELL * .2;
    for (const sgn of [1, -1]) {
      const ex = fx + ox * sgn, ey = fy + oy * sgn;
      if (blink) {
        ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = CELL * .05; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(ex - d.x * CELL * .1, ey - d.y * CELL * .1); ctx.lineTo(ex + d.x * CELL * .1, ey + d.y * CELL * .1); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex, ey, CELL * .14, 0, Math.PI * 2); ctx.fill();
      if (s.alive) {
        ctx.fillStyle = '#1b1b1b';
        ctx.beginPath(); ctx.arc(ex + d.x * CELL * .05, ey + d.y * CELL * .05, CELL * .075, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = CELL * .04; const k = CELL * .07;
        ctx.beginPath(); ctx.moveTo(ex - k, ey - k); ctx.lineTo(ex + k, ey + k);
        ctx.moveTo(ex + k, ey - k); ctx.lineTo(ex - k, ey + k); ctx.stroke();
      }
    }
  }
  const h = px(pts[0]);
  if (s.alive && s.power) { // a little badge above the head shows which power-up is active (and how long it lasts)
    const left = Math.max(0, (s.pwEnd || 0) - elapsed) / POWER_KINDS[s.power].ms;
    ctx.globalAlpha = 1; ctx.beginPath(); ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.arc(h.x, h.y - CELL * .8, CELL * .3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = POWER_KINDS[s.power].color; ctx.lineWidth = CELL * .06;
    ctx.beginPath(); ctx.arc(h.x, h.y - CELL * .8, CELL * .3, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * left); ctx.stroke();
    ctx.font = `${CELL * .26}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff'; ctx.fillText({ magnet:'🧲', double:'2×', ghost:'👻' }[s.power], h.x, h.y - CELL * .8);
  }
  if (s.alive && s.shield) { // a shimmering bubble around a shielded head
    ctx.globalAlpha = .55 + .2 * Math.sin(now / 200);
    ctx.strokeStyle = '#9fe0ff'; ctx.lineWidth = CELL * .07;
    ctx.beginPath(); ctx.arc(h.x, h.y, CELL * .62, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  if (state === 'ready' || state === 'countdown') {
    ctx.fillStyle = '#fff'; ctx.font = `bold ${CELL * .4}px Roboto, Arial`; ctx.textAlign = 'center';
    ctx.fillText(playerName(s.id), h.x, h.y - CELL * .65);
  }
  ctx.restore();
}

// The boss: a thick, spiky snake with angry eyes, a glowing tail (its weak spot) and hearts for its health.
// Each time it moves it slides smoothly into its new squares (like your snakes do).
const bossAnim = { body: null, from: null, at: 0 };
function drawBoss(now) {
  if (!boss) { bossAnim.body = null; return; }
  const B = BOSSES[boss.kind], b = boss.body, n = b.length;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (boss.under > 0) { // dug in: a rumbling dirt mound shows where it's about to pop up
    const p = boss.pop || b[0], c = px(p), pulse = .5 + .5 * Math.sin(now / 90);
    ctx.globalAlpha = .55 + .3 * pulse;
    ctx.fillStyle = '#6b4226';
    ctx.beginPath(); ctx.ellipse(c.x, c.y + CELL * .1, CELL * (.45 + .1 * pulse), CELL * .3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffcf66'; ctx.lineWidth = CELL * .06; ctx.setLineDash([CELL * .15, CELL * .12]);
    ctx.beginPath(); ctx.arc(c.x, c.y, CELL * (1.1 + .15 * pulse), 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1; ctx.font = `bold ${CELL * .5}px Roboto, Arial`; ctx.fillStyle = '#ffcf66';
    ctx.fillText('!', c.x, c.y - CELL * .05);
    ctx.restore();
    bossAnim.body = null;
    return;
  }
  // Slide from where each square was drawn before (skipped after a jump: popping up, turning around, wrapping)
  if (!bossAnim.body || bossAnim.body[0].x !== b[0].x || bossAnim.body[0].y !== b[0].y || bossAnim.body.length !== n) {
    const old = bossAnim.body;
    bossAnim.from = old && touching(old[0], b[0]) ? old.map(c => ({ ...c })) : null;
    bossAnim.body = b.map(c => ({ ...c })); bossAnim.at = now;
  }
  const k = Math.min(1, (now - bossAnim.at) / TICK), from = bossAnim.from;
  const P = b.map((c, i) => {
    const f = from && (from[i] || from[from.length - 1]);
    return px(f && touching(f, c) ? toward(f, c, k) : c);
  });
  const stunned = boss.stun > 0, flash = stunned && Math.floor(now / 90) % 2;
  const color = flash ? '#ffffff' : B.color, dark = mix(B.color, '#000000', .35);
  if (B.phase) ctx.globalAlpha = .55 + .15 * Math.sin(now / 300); // the Phantom is see-through
  // body: dark outline, then the color, in pieces (so it can wrap across edges)
  const segs = [];
  for (let i = 0; i + 1 < n; i++) if (touching(b[i], b[i + 1])) segs.push([P[i], P[i + 1]]);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [w, c] of [[CELL * .98, dark], [CELL * .84, color]]) {
    ctx.strokeStyle = c; ctx.lineWidth = w;
    for (const [A, C] of segs) { ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(C.x, C.y); ctx.stroke(); }
    ctx.fillStyle = c;
    for (const p of P) { ctx.beginPath(); ctx.arc(p.x, p.y, w / 2, 0, Math.PI * 2); ctx.fill(); }
  }
  // spikes along the back (the King Cobra gets a crown instead)
  ctx.fillStyle = dark;
  for (let i = 1; i < n - 2; i += 2) {
    const p = P[i], q = P[i + 1] || p, ang = Math.atan2(q.y - p.y, q.x - p.x) + Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(p.x + Math.cos(ang) * CELL * .52, p.y + Math.sin(ang) * CELL * .52);
    ctx.lineTo(p.x + Math.cos(ang + .5) * CELL * .3, p.y + Math.sin(ang + .5) * CELL * .3);
    ctx.lineTo(p.x + Math.cos(ang - .5) * CELL * .3, p.y + Math.sin(ang - .5) * CELL * .3);
    ctx.fill();
  }
  // the weak spot: its last two squares glow (all of it, once it's tiny)
  const glow = .5 + .5 * Math.sin(now / 160);
  for (let i = n <= 2 ? 0 : n - 2; i < n; i++) {
    ctx.strokeStyle = `rgba(255,230,90,${.55 + .4 * glow})`; ctx.lineWidth = CELL * .09;
    ctx.beginPath(); ctx.arc(P[i].x, P[i].y, CELL * (.32 + .06 * glow), 0, Math.PI * 2); ctx.stroke();
  }
  // head: angry eyes looking where it's going
  const h = P[0], d = DIRS[boss.dir];
  const ox = -d.y * CELL * .2, oy = d.x * CELL * .2, fx = h.x + d.x * CELL * .1, fy = h.y + d.y * CELL * .1;
  for (const sgn of [1, -1]) {
    const ex = fx + ox * sgn, ey = fy + oy * sgn;
    ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.arc(ex, ey, CELL * .13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = stunned ? '#555' : '#b00000';
    ctx.beginPath(); ctx.arc(ex + d.x * CELL * .04, ey + d.y * CELL * .04, CELL * .065, 0, Math.PI * 2); ctx.fill();
    // eyebrow slanting down toward the middle
    ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = CELL * .05;
    ctx.beginPath();
    ctx.moveTo(ex - d.x * CELL * .14 + ox * sgn * .35, ey - d.y * CELL * .14 + oy * sgn * .35);
    ctx.lineTo(ex + d.x * CELL * .1 - ox * sgn * .25, ey + d.y * CELL * .1 - oy * sgn * .25);
    ctx.stroke();
  }
  if (boss.kind === 'king') { // a little crown
    ctx.globalAlpha = 1; ctx.font = `${CELL * .45}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
    ctx.fillText('👑', h.x - d.x * CELL * .1, h.y - CELL * .5);
  }
  // health hearts above the head (the name and what it does are shown under the board)
  ctx.globalAlpha = 1;
  ctx.font = `${CELL * .32}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
  const hearts = '❤'.repeat(boss.hp) + '🖤'.repeat(Math.max(0, boss.max - boss.hp));
  let hy = h.y - CELL * .9; if (hy < CELL * .35) hy = h.y + CELL * .9;
  ctx.fillText(hearts, Math.min(COLS * CELL - CELL * 1.5, Math.max(CELL * 1.5, h.x)), hy);
  ctx.restore();
}
// Boss mode's line under the board: who you're fighting, or who's coming next
function bossHint() {
  if (boss) { const B = BOSSES[boss.kind]; return `${B.icon} ${B.name} — ${B.desc} · boss ${bossWave + 1} · bite its glowing tail!`; }
  const B = BOSSES[BOSS_ORDER[bossWave % BOSS_ORDER.length]];
  return bossNext > 0 && state !== 'ready' ? `Next boss: ${B.icon} ${B.name} in ${Math.ceil(bossNext * TICK / 1000)}s…` : 'Bite the boss on its glowing tail — avoid the rest of it!';
}

// Hunger mode: a little bar under each snake's head that runs down (and turns red) until it eats
function drawHunger() {
  for (const s of snakes) {
    if (!s.alive) continue;
    const L = looks[s.id], f = Math.max(0, Math.min(1, (s.hl ?? HUNGER_MS) / HUNGER_MS));
    const w = CELL * 1.1, h = CELL * .13, x = L.hx - w / 2, y = L.hy + CELL * .62;
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    ctx.fillStyle = f > .5 ? '#7bd44a' : f > .25 ? '#f2c230' : '#e8483a';
    ctx.fillRect(x, y, w * f, h);
  }
}

// Emote bubbles float above each snake's head
function drawEmotes(now) {
  // Versus: a bobbing crown over whoever is in the lead
  if (cfg.play === 'versus' && snakes.length) {
    const top = Math.max(...snakes.map(s => s.apples)), lead = snakes.filter(s => s.apples === top);
    const L = lead.length === 1 && top > 0 && lead[0].alive ? looks[lead[0].id] : null;
    if (L && L.emote < 0) {
      let y = L.hy - CELL * .78 + Math.sin(now / 260) * CELL * .05;
      if (y < CELL * .3) y = L.hy + CELL * .8;
      ctx.font = `${CELL * .5}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('👑', L.hx, y);
    }
  }
  looks.forEach((L, i) => {
    if (L.emote < 0) return;
    const age = now - L.emoteAt;
    if (age > EMOTE_MS) { L.emote = -1; return; }
    const W = COLS * CELL, r = CELL * .5;
    const x = Math.min(W - r - 4, Math.max(r + 4, L.hx));
    let y = L.hy - CELL * 1.15;
    if (y < r + 4) y = L.hy + CELL * 1.15;
    const pop = age < 160 ? .6 + .4 * age / 160 : 1;
    ctx.save();
    ctx.globalAlpha = age > EMOTE_MS - 300 ? Math.max(0, (EMOTE_MS - age) / 300) : 1;
    ctx.translate(x, y); ctx.scale(pop, pop);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = skinHex(i); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.font = `${CELL * .55}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(EMOTES[L.emote], 0, 2);
    ctx.restore();
  });
}

function drawEffects(k) {
  for (const w of waves) { // expanding rings
    w.life -= .045 * k;
    ctx.globalAlpha = Math.max(0, w.life) * .8; ctx.strokeStyle = w.color; ctx.lineWidth = CELL * .09 * w.life + 1;
    ctx.beginPath(); ctx.arc(w.x, w.y, CELL * (.35 + (1 - w.life) * 1.1), 0, Math.PI * 2); ctx.stroke();
  }
  waves = waves.filter(w => w.life > 0);
  for (const p of particles) {
    p.x += p.vx * k; p.y += p.vy * k; p.vx *= .94; p.vy = p.vy * .94 + .08 * k; p.life -= p.decay * k;
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.textAlign = 'center';
  for (const p of popups) {
    p.y -= .7 * k; p.life -= .018 * k;
    // pops in a little big, then settles
    const grow = p.life > .85 ? 1 + (p.life - .85) * 2.5 : 1;
    ctx.font = `bold ${CELL * .5 * grow}px Roboto, Arial`;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  particles = particles.filter(p => p.life > 0);
  popups = popups.filter(p => p.life > 0);
}

function drawCountdown(now) {
  const left = Math.max(0, countEnd - now), n = Math.max(1, Math.ceil(left / 600));
  if (n !== lastCount) { lastCount = n; beep(660, .1); }
  const frac = (left % 600) / 600;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(0, 0, COLS * CELL, ROWS * CELL);
  ctx.globalAlpha = Math.min(1, frac * 2 + .2);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `bold ${CELL * (2.2 + (1 - frac) * .6)}px Roboto, Arial`;
  ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(0,0,0,.25)';
  ctx.strokeText(n, COLS * CELL / 2, ROWS * CELL / 2); ctx.fillText(n, COLS * CELL / 2, ROWS * CELL / 2);
  ctx.restore();
  // Challenges and versus: say what this round is about
  const blend = cfg.game === 'blender';
  if (cfg.play === 'coop' && !blend) return;
  const c = CHALLENGES[challenge], W = COLS * CELL;
  const lines = cfg.play === 'versus'
    ? [['⚔ Versus', .62], [`Most apples in ${clock(VERSUS_MS / 1000)} wins!`, .4]]
    : cfg.play === 'challenge'
    ? [[`${c.icon} ${c.name}`, .62], [c.desc, .36], [`★ ${goal[0]}   ★★ ${goal[1]}   ★★★ ${goal[2]}${c.unit || ''}   ·   ${c.secs}s`, .36]]
    : [];
  // Blender: say which mode came up this round
  if (blend) lines.push([`🌀 ${GAME_NAMES[G]}`, lines.length ? .4 : .62], [GAMES[G], .32]);
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let y = CELL * .9;
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(0, y - CELL * .6, W, lines.reduce((h, [, s]) => h + CELL * s * 1.5, 0) + CELL * .3);
  for (const [text, size] of lines) {
    // shrink long lines to fit small boards
    ctx.font = `bold ${CELL * size}px Roboto, Arial, "Segoe UI Emoji"`;
    const fit = Math.min(1, W * .94 / ctx.measureText(text).width);
    ctx.font = `bold ${CELL * size * fit}px Roboto, Arial, "Segoe UI Emoji"`;
    ctx.fillStyle = size > .5 ? '#ffe680' : '#fff';
    ctx.fillText(text, W / 2, y);
    y += CELL * size * 1.5;
  }
  ctx.restore();
}

// Simulation runs on a timer (not just animation frames) so the host keeps going smoothly
function update() {
  const now = performance.now();
  heartbeat(now);
  if (state === 'countdown' && now >= countEnd) {
    state = 'playing'; setClock(now); beep(990, .15);
    if (role === 'guest') return;
    if (role === 'local' && awayFromGame()) return togglePause();
    sendState();
  }
  if (role === 'guest' || state !== 'playing') return;
  if (now - lastTick > TICK * 5) lastTick = now - TICK;
  while (state === 'playing' && now - lastTick >= TICK) { lastTick += TICK; tick(); }
}
setInterval(update, 8);
// Browsers slow timers in hidden or covered windows to about once a second, which would freeze an online
// game whenever the host switches to another window. Timers in a worker keep running, so use one too.
try {
  const worker = new Worker(URL.createObjectURL(new Blob(['setInterval(() => postMessage(0), 8)'], { type:'text/javascript' })));
  worker.onmessage = () => update();
} catch (e) {}

// Light mode: darkness over the board, with a pool of light around each head and a faint glow on apples
const darkCv = document.createElement('canvas'), dctx = darkCv.getContext('2d');
function drawDark(now) {
  const W = COLS * CELL, H = ROWS * CELL;
  if (darkCv.width !== canvas.width || darkCv.height !== canvas.height) { darkCv.width = canvas.width; darkCv.height = canvas.height; }
  dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  dctx.globalCompositeOperation = 'source-over';
  dctx.clearRect(0, 0, W, H);
  dctx.fillStyle = 'rgba(8,14,24,.93)'; dctx.fillRect(0, 0, W, H);
  dctx.globalCompositeOperation = 'destination-out';
  const hole = (x, y, r, a) => {
    const g = dctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(.55, `rgba(0,0,0,${a * .85})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = g; dctx.beginPath(); dctx.arc(x, y, r, 0, Math.PI * 2); dctx.fill();
  };
  for (const s of snakes) {
    const L = looks[s.id];
    hole(L.hx, L.hy, CELL * (s.alive ? 3.3 + .1 * Math.sin(now / 400 + s.id) : 1.2), s.alive ? 1 : .5);
  }
  for (const a of apples) if (!a.poison) hole((a.x + .5) * CELL, (a.y + .5) * CELL, CELL * .8, .55);
  ctx.drawImage(darkCv, 0, 0, W, H);
}

let lastFrame = performance.now();
function frame(now) {
  frameK = Math.min(3, (now - lastFrame) / 16.67); lastFrame = now;
  pollPads();
  if (role === 'guest') pumpInbox();
  update();
  const t = state === 'playing' ? Math.max(0, Math.min(1, (now - lastTick) / TICK)) : state === 'paused' ? pausedT : 0;

  ctx.save();
  if (shake > .02) { ctx.translate(rand(-1, 1) * shake * 10, rand(-1, 1) * shake * 10); shake *= Math.pow(.88, frameK); }
  drawBoard();
  rocks.forEach(r => drawRock(r, now));
  statues.forEach(r => drawStatue(r, now, true));
  drawPortals(now);
  apples.forEach(a => drawApple(a, now));
  // Notice snakes appearing or crashing, to animate it (works the same on every player's screen)
  for (const s of snakes) {
    const L = looks[s.id];
    if (L.wasAlive === false && s.alive) L.spawnAt = now;
    if (L.wasAlive === true && !s.alive) L.dieAt = now;
    L.wasAlive = s.alive;
  }
  snakes.filter(s => !s.alive).forEach(s => drawSnake(s, t, now));
  snakes.filter(s => s.alive).forEach(s => drawSnake(s, t, now));
  if (G === 'boss') drawBoss(now);
  drawPortals(now, true);
  snakes.forEach(s => { s.eatFx = Math.max(0, s.eatFx - .06 * frameK); });
  drawEffects(frameK);
  if (G === 'hunger') drawHunger();
  if (G === 'light') drawDark(now);
  drawEmotes(now);
  ctx.restore();
  if (state === 'countdown') drawCountdown(now);
  requestAnimationFrame(frame);
}

$('muteBtn').textContent = muted ? '🔇' : '🔊';
skins = startingSkins();
reset();
showIntro();
applySkins();
requestAnimationFrame(frame);

// Opened from an invite link (…/#join=CODE)? Jump straight into that room.
const invite = /^#join=([A-Za-z0-9]{6})$/.exec(location.hash);
if (invite) {
  history.replaceState(null, '', location.pathname + location.search);
  uiMode = 'online';
  $('codeIn').value = invite[1].toUpperCase();
  joinGame(invite[1]);
}
</script>
</body>
</html>
