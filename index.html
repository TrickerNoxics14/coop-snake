<script>
// The online library (PeerJS) is pinned with a hash, so a tampered copy from a CDN is refused. It loads in the
// background (the page doesn't wait for it), and if one server is slow or blocked, the next one is tried: all
// three serve the exact same file.
window.loadPeerLib = (() => {
  const HASH = 'sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR';
  const URLS = ['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'];
  let running = null;
  const tryOne = url => new Promise(done => {
    const s = document.createElement('script');
    const t = setTimeout(() => done(!!window.Peer), 7000);
    s.src = url; s.integrity = HASH; s.crossOrigin = 'anonymous';
    s.onload = () => { clearTimeout(t); done(!!window.Peer); };
    s.onerror = () => { clearTimeout(t); s.remove(); done(false); };
    document.head.appendChild(s);
  });
  return () => {
    if (window.Peer) return Promise.resolve(true);
    if (!running) running = (async () => {
      for (const u of URLS) { if (await tryOne(u)) return true; }
      return !!window.Peer;
    })().finally(() => { running = null; });
    return running;
  };
})();
window.loadPeerLib();
</script>
<style>

  .settings { display:grid; grid-template-columns:auto auto; gap:6px 12px; align-items:center; font-size:14px; }
  .settings > span { text-align:right; opacity:.85; }
  .settings.locked .seg { opacity:.55; pointer-events:none; }
  .mode-desc { grid-column:1 / -1; font-size:12px; opacity:.85; max-width:380px; justify-self:center; line-height:1.4; }
  .seg { display:inline-flex; background:rgba(0,0,0,.3); border-radius:8px; padding:3px; }
  .seg[data-key="game"] { flex-wrap:wrap; justify-content:center; max-width:290px; }

  }
  .seg button.on { background:#fff; color:#2d4d1a; font-weight:700; opacity:1; }
  .modes button { font-size:14px; padding:6px 16px; }
  .paused .menu-only { display:none !important; }
  .overlay:not(.paused) .paused-only { display:none !important; }
  .online { display:flex; flex-direction:column; align-items:center; gap:10px; }

  .btns { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

  .gbar select { background:transparent; color:#fff; border:0; font:inherit; font-size:14px; font-weight:600; outline:none; cursor:pointer; }

  .two { font-size:14px; display:flex; align-items:center; gap:6px; cursor:pointer; }

  .lobby h3 { margin:0 0 6px; font-size:14px; }
  .lobby .room { display:flex; align-items:center; gap:8px; padding:4px 0; border-top:1px solid rgba(255,255,255,.1); }
  .lobby .room span { flex:1; text-align:left; }
  .lobby .room small { opacity:.75; }
  .lobby .empty { opacity:.75; font-size:13px; }
  .extras { display:flex; gap:14px; justify-content:center; }
  .stars { color:#ffe680; letter-spacing:1px; }
  .hud .low { color:#ffd0c8; }
  .rank { display:flex; gap:8px 14px; flex-wrap:wrap; justify-content:center; font-size:16px; margin:4px 0; }
  .rank span { display:flex; align-items:center; gap:5px; }
  .targets { font-size:13px; opacity:.9; }
  .emotes { display:flex; justify-content:center; gap:10px; margin-top:8px; }
  .emotes button {
    font-size:22px; line-height:1; background:rgba(255,255,255,.08); border:0; border-radius:10px;
    padding:7px 12px; cursor:pointer;
  }
  .emotes button:hover { background:rgba(255,255,255,.18); }
  .hint { font-size:12px; opacity:.7; text-align:center; margin-top:8px; }
  /* Animations */
  @keyframes bump { 0% { transform:scale(1); } 35% { transform:scale(1.4); } 100% { transform:scale(1); } }
  .bump { display:inline-block; animation:bump .32s ease-out; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes popIn { from { opacity:0; transform:translateY(12px) scale(.96); } to { opacity:1; transform:none; } }
  .overlay:not(.hidden) { animation:fadeIn .2s ease-out; }
  .overlay:not(.hidden) .ov-inner { animation:popIn .3s ease-out; }
  #fx { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:5; border-radius:inherit; }
  .confetti { position:absolute; top:-14px; width:8px; height:13px; border-radius:2px; animation:fall linear forwards; }
  @keyframes fall { to { transform:translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity:.1; } }
  @media (prefers-reduced-motion: reduce) { .overlay, .ov-inner, .bump, .confetti { animation:none !important; } }
  @media (max-width:560px) {
    .overlay { padding:10px; }
    .ov-inner { gap:8px; }
    .overlay h1 { font-size:24px; }
    .overlay p { font-size:13px; }
    .hud { font-size:18px; padding:6px 8px 6px 12px; gap:8px; }
    .seg button { padding:4px 7px; font-size:12px; }
  }
</style>

<script>
// ---------- Config ----------
const SPEEDS = { slow:180, normal:135, fast:95 };
const BOARDS = { small:[10,9], medium:[17,15], large:[24,21] };
const GAMES = {
  classic: "Crash and you're out for 3 seconds. If you're both down at once, it's game over.",
  maze: 'Every apple you eat drops a rock somewhere on the board. How long can you survive?',
  peaceful: 'Nobody can crash! Walls just stop you and you slide through snakes. Relax and eat.',
  poison: 'Dark ☠ apples are poison: eating one knocks you out. They jump to new spots whenever an apple is eaten.',
  portal: 'Two pairs of portals: go into one and you pop out of its twin, still heading the same way.',
  speed: 'Every point the team scores makes both snakes a little faster. How far can you push it?',
  statue: 'Every apple you eat leaves a stone statue of your snake behind (your old statue crumbles). Don\'t crash into them!',

  boss: 'Boss fight! Bite a boss on its glowing tail to hurt it — touching the rest of it knocks you out. Beat one and a tougher one shows up.',
  blender: 'A random mode every round — keep on your toes!',
};
const GAME_NAMES = { classic:'Classic', maze:'Maze', peaceful:'Peaceful', poison:'Poison', portal:'Portal', speed:'Speed-up',
  statue:'Statue', reverse:'Reverse', key:'Key', light:'Light', shield:'Shield', magnet:'Magnet', boss:'Boss', squeeze:'Squeeze', runaway:'Runaway', hunger:'Hunger', blender:'Blender' };
// Blender picks one of these each round
const BLEND = ['classic', 'maze', 'poison', 'portal', 'speed', 'statue', 'reverse', 'key', 'light', 'shield', 'magnet', 'boss', 'squeeze', 'runaway', 'hunger'];
// Boss mode: the bosses take turns, and each round through all of them gets tougher.
// `every` = moves once every this many player moves; `ai` = how it picks where to go.
// Specials: `phase` = slides right through snakes' bodies, `slime` = leaves a trail that knocks you out
// for a few seconds, `burrow` = digs underground and pops up somewhere else.
const BOSSES = {
  chomper: { name:'Chomper', icon:'👹', color:'#d7263d', hp:3, len:7, every:2, ai:'chase', desc:'chases the closest snake' },
  glutton: { name:'Glutton', icon:'🐷', color:'#f08a24', hp:4, len:6, every:2, ai:'apples', desc:'steals your apples' },
  zippy:   { name:'Zippy', icon:'⚡', color:'#8e44ad', hp:3, len:5, every:1, ai:'wander', desc:'fast and twitchy' },
  phantom: { name:'Phantom', icon:'👻', color:'#7f8fa6', hp:3, len:6, every:2, ai:'chase', phase:true, desc:'floats right through your bodies' },
  spitter: { name:'Spitter', icon:'🤢', color:'#2e9e44', hp:4, len:7, every:2, ai:'wander', slime:true, desc:'leaves a slime trail — don\'t touch it' },
  mole:    { name:'Mole', icon:'🕳', color:'#8d5a3b', hp:4, len:6, every:2, ai:'chase', burrow:true, desc:'digs underground and pops up near you' },

const BOSS_ORDER = ['chomper', 'glutton', 'zippy', 'phantom', 'spitter', 'mole', 'titan', 'king', 'shark', 'bomber', 'wizard', 'kraken'];
const SLIME_TICKS = 45, MOLE_DIG_EVERY = 18, MOLE_UNDER = 6;
const SQUEEZE_START_MS = 15000, SQUEEZE_PAUSE_MS = 7000, FLEE_RANGE = 3, HUNGER_MS = 10000;

const GLIDE_MS = 80; // how fast the head glides onto a new line after a mid-square turn
const SHIELD_SAFE_MS = 1500, SHIELD_EVERY = 4, MAGNET_RANGE = 4;
let G = 'classic'; // the mode actually being played this round (differs from cfg.game in Blender)
// How you play: endless co-op, timed team challenges, or everyone for themselves
const PLAYS = {
  coop: '',
  challenge: 'Challenges: each round gives your team a random goal and a time limit. Hit the targets for up to 3 ★!',
  versus: 'Versus: every snake for itself! Most apples when the 1:30 runs out wins. Crashing shrinks you back to 3.',

const VERSUS_MS = 90000, CUT_BONUS = 2;

  if (tickNo % 2) return;
  // (a square with a snake on it waits until the snake has moved off)
  const i = sq.left.findIndex(c => !snakes.some(s => s.alive && s.body.some(b => eq(b, c))) && bossAt(c) < 0);
  if (i < 0) return;
  const c = sq.left.splice(i, 1)[0];
  // an apple on that square hops to a free one further in
  const hit = apples.filter(a => eq(a, c));
  if (hit.length) {
    const occ = occupied();
    const free = [];
    for (let y = sq.ring + 1; y < ROWS - 1 - sq.ring; y++) for (let x = sq.ring + 1; x < COLS - 1 - sq.ring; x++)
      if (!occ.some(o => o.x === x && o.y === y)) free.push({ x, y });
    for (const a of hit) {
      if (free.length) { const p = free.splice(Math.random() * free.length | 0, 1)[0]; a.x = p.x; a.y = p.y; }
      else apples.splice(apples.indexOf(a), 1);
    }
    while (normalApples() < cfg.apples) if (!spawnApple()) break;
  }
  rocks.push({ x: c.x, y: c.y, wall: true });
  burst(c, '#6d6f74', 3, 1.5);
}

// Hunger mode: a snake that goes 10 seconds without eating starves and is knocked out
function hungerTick() {
  for (const s of snakes) {
    if (!s.alive) { s.fed = elapsed; s.hl = HUNGER_MS; continue; }
    s.hl = Math.max(0, HUNGER_MS - (elapsed - (s.fed ?? elapsed)));
    if (s.hl > 0) continue;
    knockOut(s); popup(s.body[0], 'Starved!', '#ffd0a0');
    s.hl = HUNGER_MS;
  }
}

// Magnet mode: every other move, apples near a head slide one square toward the closest one
function pullApples() {
  const heads = snakes.filter(s => s.alive).map(s => s.body[0]);
  for (const a of apples) {
    if (a.poison || a.locked) continue;
    let best = null, bd = MAGNET_RANGE + 1;
    for (const h of heads) { const d = Math.abs(h.x - a.x) + Math.abs(h.y - a.y); if (d < bd) { bd = d; best = h; } }
    if (!best || bd <= 1) continue;
    const dx = Math.sign(best.x - a.x), dy = Math.sign(best.y - a.y);
    const tries = Math.abs(best.x - a.x) >= Math.abs(best.y - a.y) ? [[dx, 0], [0, dy]] : [[0, dy], [dx, 0]];
    const occ = occupied();
    for (const [mx, my] of tries) {
      const p = { x: a.x + mx, y: a.y + my };
      if ((mx || my) && inBounds(p) && !occ.some(c => eq(c, p))) { a.x = p.x; a.y = p.y; break; }
    }
  }
}

// Key mode: whenever an apple is caged, there's a key somewhere to open it
function ensureKey() {
  if (apples.some(a => a.locked) && !apples.some(a => a.key)) spawnApple('key');
}

// Statue mode: eating leaves a statue of your snake. Its squares turn solid once nobody is on them
// (they wait in `statues` until then, and become rocks that remember whose statue they are).
let statues = [];
function makeStatue(s) {
  rocks = rocks.filter(r => r.statue !== s.id);
  statues = statues.filter(c => c.statue !== s.id).concat(s.body.map(c => ({ x:c.x, y:c.y, statue:s.id })));
  beep(260, .1, 0, 'triangle');
}
function settleStatues() {
  const onSnake = c => snakes.some(s => s.alive && s.body.some(b => eq(b, c)));
  const ready = statues.filter(c => !onSnake(c) && !apples.some(a => eq(a, c)));
  if (!ready.length) return;
  statues = statues.filter(c => !ready.includes(c));
  rocks.push(...ready);
}

// ---------- Boss mode ----------
let boss = null, bossWave = 0, bossNext = 0; // bossNext = moves until the next boss shows up
// Which square of the boss is at p (-1 = none). A boss that's dug underground can't be touched.
const bossAt = p => boss && !(boss.under > 0) ? boss.body.findIndex(c => eq(c, p)) : -1;
const bossCells = () => boss && !(boss.under > 0) ? boss.body : [];
function wrapDist(a, b) {
  let dx = Math.abs(a.x - b.x), dy = Math.abs(a.y - b.y);
  if (cfg.mode === 'wrap') { dx = Math.min(dx, COLS - dx); dy = Math.min(dy, ROWS - dy); }
  return dx + dy;
}

// Find a free straight line for a boss of length `len`, with its head a good distance from everyone.
// `near` (optional) = try to put the head about that far from this square (the Mole pops up near you).
function bossSpot(len, near) {
  const occ = occupied(), free = p => inBounds(p) && !occ.some(c => eq(c, p));
  const heads = snakes.filter(s => s.alive).map(s => s.body[0]);
  for (let tries = 0; tries < 500; tries++) {
    const dir = ['left', 'right', 'up', 'down'][Math.random() * 4 | 0], d = DIRS[dir];
    const head = near && tries < 300
      ? { x: near.x + (Math.random() * 13 | 0) - 6, y: near.y + (Math.random() * 13 | 0) - 6 }
      : { x: Math.random() * COLS | 0, y: Math.random() * ROWS | 0 };
    const body = Array.from({ length: len }, (_, i) => ({ x: head.x - d.x * i, y: head.y - d.y * i }));
    if (!body.every(free) || heads.some(h => wrapDist(h, head) < 5)) continue;
    // and it shouldn't be facing straight into a wall
    if (!inBounds(step(head, dir)) && cfg.mode !== 'wrap') continue;
    return { body, dir };
  }
  return null;
}

// A new boss appears, well away from everyone's heads
function spawnBoss() {
  const kind = BOSS_ORDER[bossWave % BOSS_ORDER.length], B = BOSSES[kind];
  const spot = bossSpot(Math.max(3, Math.min(B.len, Math.min(COLS, ROWS) - 2)));
  if (!spot) { bossNext = 3; return; } // no room right now: try again in a moment
  const hp = B.hp + Math.floor(bossWave / BOSS_ORDER.length); // each round through all the bosses is tougher
  boss = { kind, body: spot.body, dir: spot.dir, hp, max: hp, stun: 4, wait: 0, grow: 0, moves: 0, under: 0, dig: MOLE_DIG_EVERY };
  for (const c of spot.body) burst(c, B.color, 4, 2.5);
  popup(spot.body[0], B.name.split(' ')[0] + '!', '#ffd0d0');
  doShake(); beep(110, .3, 0, 'sawtooth'); beep(82, .4, .2, 'sawtooth');
}

// Can the boss move its head onto p? Walls, rocks and its own body block it, and so do snakes' bodies
// (unless it's the Phantom). It can bite a snake's head, though.
function bossCanEnter(p) {
  if (!inBounds(p) || rocks.some(r => eq(r, p) && !('slime' in r))) return false;
  const i = boss.body.findIndex(c => eq(c, p));
  if (i >= 0 && (i < boss.body.length - 1 || boss.grow > 0)) return false;
  if (BOSSES[boss.kind].phase) return true;
  return !snakes.some(s => s.alive && s.body.some((c, j) => j > 0 && eq(c, p)));
}

// How much room the boss would have from p (counting up to `limit` squares), so it doesn't
// steer itself into a dead end and get stuck
function bossRoom(p, limit) {
  const seen = new Set([p.x + ',' + p.y]), queue = [p];
  while (queue.length && seen.size < limit) {
    const c = queue.shift();
    for (const d in DIRS) {
      const n = step(c, d), k = n.x + ',' + n.y;
      if (seen.has(k) || !bossCanEnter(n)) continue;
      seen.add(k); queue.push(n);
    }
  }
  return seen.size;
}

function bossTarget(ai) {
  const near = list => list.sort((a, b) => wrapDist(boss.body[0], a) - wrapDist(boss.body[0], b))[0] || null;
  if (ai === 'apples') { const a = near(apples.filter(a => !a.poison)); if (a) return a; }
  if (ai === 'wander') return null;
  return near(snakes.filter(s => s.alive).map(s => s.body[0]));
}

function knockOut(s) {
  s.alive = false; s.queue = []; s.log = []; s.respawn = RESPAWN_TICKS; s.power = null;
  burst(s.body[0], skinHex(s.id), 22, 4);
  doShake(); beep(160, .25, 0, 'sawtooth');
}

// The boss takes a hit (bitten by snake `by` at square `cut`, or boxed in so it can't move)
function hurtBoss(by, label, cut) {
  const B = BOSSES[boss.kind], tail = cut !== undefined ? boss.body[cut] : boss.body[boss.body.length - 1];
  boss.hp--; boss.stun = BOSS_STUN;
  // a bite takes the tail off from where it was bitten (it grows back a little)
  if (cut !== undefined) { boss.body.length = Math.max(1, cut); boss.grow += 2; }
  burst(tail, '#ffe066', 16, 3.5); popup(tail, label, '#ffe066');
  doShake(); beep(196, .12, 0, 'square'); beep(147, .18, .1, 'square');
  if (by) { by.apples += BOSS_HIT_POINTS; score += BOSS_HIT_POINTS; }
  if (boss.hp > 0) return;
  // Defeated!
  for (const c of boss.body) burst(c, B.color, 10, 4.5);
  popup(boss.body[0], 'Defeated!', '#ffe680');
  score += BOSS_WIN_POINTS; if (by) by.apples += BOSS_WIN_POINTS;
  stats.bosses++; bossWave++;
  rocks = rocks.filter(r => !('slime' in r)); // its slime goes with it
  boss = null; bossNext = Math.round(BOSS_GAP_MS / TICK);
  beep(523, .1); beep(659, .1, .1); beep(784, .1, .2); beep(1047, .25, .3);
}

// The Mole: dig in (it's untouchable underground), then pop up near a snake
function moleTick() {
  if (boss.under > 0) {
    if (--boss.under > 0) return true;
    const spot = bossSpot(boss.body.length, boss.pop);
    if (spot) { boss.body = spot.body; boss.dir = spot.dir; }
    boss.stun = 2; boss.dig = MOLE_DIG_EVERY;
    for (const c of boss.body) burst(c, '#8d5a3b', 5, 3);
    popup(boss.body[0], 'Pop!', '#ffd0a0'); doShake(); beep(140, .15, 0, 'triangle');
    return true;
  }
  if (--boss.dig > 0) return false;
  // dig in: it'll come up close to whoever is nearest
  boss.under = MOLE_UNDER;
  boss.pop = bossTarget('chase') || boss.body[0];
  for (const c of boss.body) burst(c, '#8d5a3b', 4, 2);
  beep(90, .2, 0, 'triangle');
  return true;
}

// The boss's move (after the snakes have moved)
function bossTick() {
  // slime dries up after a while
  if (rocks.some(r => 'slime' in r)) rocks = rocks.filter(r => !('slime' in r) || --r.slime > 0);
  if (!boss) { if (bossNext > 0 && --bossNext === 0) spawnBoss(); return; }
  if (boss.stun > 0) { boss.stun--; return; }
  const B = BOSSES[boss.kind];
  if (++boss.wait < B.every) return;
  boss.wait = 0;
  if (B.burrow && moleTick()) return;
  // Wizard: every 12 moves it vanishes and reappears somewhere else
  if (B.teleport && boss.moves > 0 && boss.moves % 12 === 0) {
    const spot = bossSpot(boss.body.length);
    if (spot) { for (const c of boss.body) burst(c, B.color, 3, 2); boss.body = spot.body; boss.dir = spot.dir; popup(spot.body[0], 'Poof!', '#d8b4fe'); return; }
  }
  const h = boss.body[0];
  let opts = Object.keys(DIRS).filter(d => d !== OPP[boss.dir] && bossCanEnter(step(h, d)));
  if (!opts.length) { // boxed in! It gets hurt and turns around
    hurtBoss(null, 'Trapped!');
    if (boss) {
      boss.body.reverse();
      boss.dir = Object.keys(DIRS).find(d => boss.body.length > 1 && eq(step(boss.body[1], d), boss.body[0])) || OPP[boss.dir];
    }
    return;
  }
  // Don't head into a dead end: prefer ways with enough room for the whole boss
  const need = boss.body.length + 3, room = {};
  for (const d of opts) room[d] = bossRoom(step(h, d), need);
  const roomy = opts.filter(d => room[d] >= need);
  opts = roomy.length ? roomy : [opts.sort((a, b) => room[b] - room[a])[0]];
  const target = bossTarget(B.ai);
  let dir;
  if (!target || Math.random() < (B.ai === 'wander' ? .35 : .15)) // a bit of randomness so it's not perfect
    dir = opts.includes(boss.dir) && Math.random() < .65 ? boss.dir : opts[Math.random() * opts.length | 0];
  else dir = opts.sort((a, b) => wrapDist(step(h, a), target) - wrapDist(step(h, b), target))[0];
  boss.dir = dir;
  const nh = step(h, dir);
  boss.body.unshift(nh); boss.moves++;
  const tail = boss.grow > 0 ? null : boss.body.pop();
  if (boss.grow > 0) boss.grow--;
  // the Bomber leaves a bomb on its tail every move (a bomb is a short-lived hazard, like slime)
  if (B.bomb && tail) rocks.push({ x: tail.x, y: tail.y, slime: 30, bomb: true });
  // the Spitter leaves slime behind it every other move
  if (B.slime && tail && boss.moves % 2 === 0 && rocks.filter(r => 'slime' in r).length < 30)
    rocks.push({ x: tail.x, y: tail.y, slime: SLIME_TICKS });
  for (const s of snakes) if (s.alive && eq(s.body[0], nh)) { knockOut(s); popup(nh, 'Chomp!', '#ffb3b3'); }
  const ai = apples.findIndex(a => eq(a, nh));
  if (ai >= 0) { // it eats the apple (and grows)
    const a = apples.splice(ai, 1)[0];
    if (boss.body.length < 20) boss.grow += a.gold ? 2 : 1;
    burst(a, B.color, 10, 2.5); popup(a, 'Yoink!', '#ffd0a0'); beep(300, .08, 0, 'sawtooth');
    while (normalApples() < cfg.apples) spawnApple();
  }
}

// Reverse mode: the snake turns around — the tail end becomes the head
function flipSnake(s) {
  s.body.reverse();
  const [h, n] = s.body;
  s.dir = Object.keys(DIRS).find(d => eq(step(n, d), h))
       || Object.keys(DIRS).find(d => !aheadBlocked(s, d) && !eq(step(h, d), n)) || OPP[s.dir];
  s.queue = []; s.log = []; s.flipped = true;
  burst(h, skinHex(s.id), 10, 2.5);
  beep(700, .06, 0, 'sine'); beep(500, .08, .06, 'sine');
}

// Portal mode: two linked pairs, kept away from the starting rows, the edges and each other
function placePortals(rows) {
  for (let tries = 0; tries < 2000 && portals.length < 4; tries++) {
    const p = { x: 1 + (Math.random() * (COLS - 2) | 0), y: 1 + (Math.random() * (ROWS - 2) | 0) };
    if (rows.includes(p.y) || occupied().some(c => eq(c, p))) continue;
    if (portals.some(q => Math.abs(q.x - p.x) + Math.abs(q.y - p.y) < 4)) continue;
    portals.push(p);
  }
  if (portals.length < 4) portals = [];
}

// Poison mode: as many poison apples as real ones, and they all move whenever an apple is eaten
function movePoison() {
  apples = apples.filter(a => !a.poison);
  for (let i = 0; i < cfg.apples; i++) spawnApple('poison');
}

function spawnApple(kind) {
  const gold = kind === true || kind === 'gold';
  const occ = occupied();
  // Poison never lands right next to a snake's head, so you always get a fair chance to dodge it
  const nearHead = c => (kind === 'poison' || kind === 'key' || (!kind && G === 'key')) && snakes.some(s => s.alive && Math.abs(s.body[0].x - c.x) <= 2 && Math.abs(s.body[0].y - c.y) <= 2);
  const free = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++)
    if (!occ.some(c => c.x === x && c.y === y) && !nearHead({ x, y })) free.push({x,y});
  if (!free.length) return;
  const a = free[Math.random() * free.length | 0];
  if (gold) { a.gold = true; a.ttl = Math.round(GOLD_MS / TICK); a.max = a.ttl; }
  if (kind === 'poison') a.poison = true;
  if (kind === 'key') a.key = true;
  else if (kind === 'shield') a.shield = true;
  else if (kind === 'power') a.power = Object.keys(POWER_KINDS)[Math.random() * 3 | 0];
  else if (!kind && G === 'key') a.locked = true;
  apples.push(a);
  if (gold) { burst(a, '#ffd54a', 14, 2.5); beep(1046, .08); beep(1568, .12, .07); }
}

// Maze mode: drop a rock somewhere that isn't right next to or in front of a snake
function spawnRock() {
  if (rocks.length >= Math.floor(COLS * ROWS * ROCK_MAX)) return;
  const occ = occupied();
  const heads = snakes.filter(s => s.alive).map(s => ({ h: s.body[0], dir: nextDir(s) }));
  const tooClose = c => heads.some(({ h, dir }) => {
    if (Math.abs(h.x - c.x) <= 2 && Math.abs(h.y - c.y) <= 2) return true;
    for (let i = 0, p = h; i < 6; i++) { p = step(p, dir); if (eq(p, c)) return true; }
    return false;
  });
  const free = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = { x, y };
    if (!occ.some(o => eq(o, c)) && !tooClose(c)) free.push(c);
  }
  if (!free.length) return;
  const r = free[Math.random() * free.length | 0];
  rocks.push(r);
  burst(r, '#8a8f98', 10, 2.5);
  beep(110, .12, 0, 'triangle');
}

function respawnSnake(s) {
  const occ = occupied();
  const isFree = p => inBounds(p) && !occ.some(c => eq(c, p));
  for (let tries = 0; tries < 500; tries++) {
    const x = 3 + (Math.random() * Math.max(1, COLS - 6) | 0), y = Math.random() * ROWS | 0;
    const dir = x < COLS / 2 ? 'right' : 'left', d = DIRS[dir];
    const body = [0,1,2].map(i => ({ x: x - d.x * i, y }));
    const ahead = [1,2,3].map(i => ({ x: x + d.x * i, y }));
    // (and not right next to a boss's head, so you don't get bitten the moment you're back)
    const awayFromBoss = !boss || tries > 350 || wrapDist(body[0], boss.body[0]) > 5;
    if (body.every(isFree) && ahead.every(isFree) && awayFromBoss) {
      Object.assign(s, { body, dir, queue:[], alive:true, respawn:0, pending:0, eatFx:1, blocked:false, log:[], fresh:true, moves:0, safe:0, fed:elapsed, hl:HUNGER_MS, power:null });
      burst(body[0], skinHex(s.id), 16, 3);
      beep(520, .08); beep(780, .1, .08);
      return true;
    }
  }
  return false;
}

// ---------- Game logic (runs on local games and on the online host) ----------
function tick() {
  recording = true;
  tickNo++;
  elapsed += TICK;
  recordFrame();
  const peaceful = G === 'peaceful';
  snakes.forEach(s => { s.fresh = false; s.ateNow = false; s.flipped = false; if (s.safe > 0) s.safe--; });
  for (const s of snakes) if (s.power && elapsed >= s.pwEnd) s.power = null; // power-ups run out
  // Magnet: the snake pulls nearby apples toward its head every move
  for (const s of snakes) if (s.alive && s.power === 'magnet') pullTo(s);
  snakes.forEach(s => { if (!s.alive && s.respawn > 0 && --s.respawn === 0 && !respawnSnake(s)) s.respawn = 1; });

  apples.forEach(a => { if (a.gold) a.ttl--; });
  apples.filter(a => a.gold && a.ttl <= 0).forEach(a => burst(a, '#ffd54a', 8, 1.5));
  apples = apples.filter(a => !a.gold || a.ttl > 0);

  const live = snakes.filter(s => s.alive);
  for (const s of live) {
    const was = s.dir;
    if (s.queue.length) s.dir = s.queue.shift();
    s.turned = s.dir !== was;
    const next = dest(s.body[0], s.dir);
    s.next = null;
    const gate = portalAt(step(s.body[0], s.dir));
    if (gate >= 0) { // whoosh through a portal
      burst(portals[gate], PORTAL_COLORS[gate >> 1], 10, 2.5); burst(portals[gate ^ 1], PORTAL_COLORS[gate >> 1], 10, 2.5);
      beep(600, .06, 0, 'sine'); beep(900, .08, .05, 'sine');
    }
    if ((peaceful || s.safe > 0) && !inBounds(next)) { // Peaceful (or a snake that just used its shield): walls just stop you
      if (!s.blocked) beep(220, .07, 0, 'triangle');
      s.blocked = true;
      continue;
    }
    s.blocked = false;
    s.next = next;
    s.appleIdx = apples.findIndex(a => eq(a, next));
    s.oldBody = s.body.slice(); s.oldPending = s.pending;
  }
  const movers = live.filter(s => s.next);
  for (const s of movers) {
    s.body.unshift(s.next); s.moves++;
    if (s.pending > 0) { s.pending--; s.popped = null; } else s.popped = s.body.pop();
  }
  // Boss mode: biting the boss's tail (its last two squares) hurts it
  // (a boss that's down to its last couple of squares is all tail, so you can always finish it off)
  for (const s of movers) s.bitBoss = false;
  if (boss) for (const s of movers) {
    const i = bossAt(s.body[0]);
    if (i >= 0 && (i >= 1 && i >= boss.body.length - 2 || boss.body.length <= 2)) {
      s.bitBoss = true; // (so biting it doesn't also count as crashing into it)
      hurtBoss(s, 'Hit! +' + BOSS_HIT_POINTS, i);
    }
    if (!boss) break;
  }
  const crashed = peaceful ? [] : movers.filter(s => {
    const h = s.body[0];
    return !inBounds(h)
      || (bossAt(h) >= 0 && !s.bitBoss)
      || rocks.some(r => eq(r, h))
      || (s.appleIdx >= 0 && (apples[s.appleIdx].poison || apples[s.appleIdx].locked))
      || (s.power !== 'ghost' && (s.body.some((c, i) => i > 0 && eq(c, h))
        || live.some(o => o !== s && o.body.some(c => eq(c, h)))));  // (a Ghost power-up passes through bodies)
  });
  // Shield mode: a shield takes the hit, then the snake is see-through for a moment so it can slip free
  for (const s of crashed) {
    if (s.safe > 0 || !s.shield) continue;
    s.shield = false; s.safe = Math.round(SHIELD_SAFE_MS / TICK);
    // the crashing move doesn't happen (so it never ends up off the board)
    s.body = s.oldBody; s.pending = s.oldPending; s.next = null; s.appleIdx = -1;
    burst(s.body[0], '#7fd4ff', 18, 3.5);
    popup(s.body[0], 'Shield!', '#bfe9ff');
    beep(520, .08, 0, 'triangle'); beep(330, .14, .07, 'triangle');
  }
  const dying = crashed.filter(s => !(s.safe > 0));
  if (cfg.play === 'versus') for (const s of dying) {
    // Versus: whoever you crashed into gets a bonus (unless they crashed too)
    const h = s.body[0], by = live.find(o => o !== s && !dying.includes(o) && o.body.some(c => eq(c, h)));
    if (by) {
      by.apples += CUT_BONUS; score += CUT_BONUS;
      popup(by.body[0], 'Cut off +' + CUT_BONUS, '#ffe680');
      beep(1320, .08, .1, 'triangle');
    }
  }
  stats.safeMs = dying.length ? 0 : stats.safeMs + TICK;
  for (const s of dying) {
    s.alive = false; s.body = s.oldBody; s.pending = s.oldPending; s.queue = []; s.log = []; s.power = null;
    s.respawn = RESPAWN_TICKS;
    burst(s.body[0], skinHex(s.id), 22, 4);
    doShake();
  }
  if (dying.length) beep(160, .25, 0, 'sawtooth');

  const eaten = new Set();
  for (const s of movers) {
    if (!s.alive || s.appleIdx < 0 || eaten.has(s.appleIdx)) continue;
    if (apples[s.appleIdx].poison || apples[s.appleIdx].locked) continue; // (a shielded snake can pass over these)
    eaten.add(s.appleIdx); s.ateNow = true;
    eatApple(s, apples[s.appleIdx]);
  }
  if (eaten.size) {
    apples = apples.filter((_, i) => !eaten.has(i));
    refillAfterEating(eaten.size);
  }
  // Remember each snake's last few moves, so a late key press from an online friend can still count
  for (const s of live) {
    if (!s.alive || s.fresh || s.flipped || s.safe > 0) { s.log = []; continue; }
    s.log.unshift(s.next ? { tail:s.popped, turn:s.turned, ate:s.ateNow, ok:!dying.length }
                         : { tail:null, turn:false, ate:false, ok:false });
    if (s.log.length > maxRewind()) s.log.length = maxRewind();
  }
  stats.longest = Math.max(stats.longest, ...snakes.map(s => s.body.length));
  if (statues.length) settleStatues();
  if (G === 'boss') bossTick();
  if (G === 'magnet' && tickNo % 2 === 0) pullApples();
  if (G === 'runaway' && tickNo % 2 === 0) fleeApples();
  if (G === 'squeeze') squeezeTick();
  if (G === 'hunger') hungerTick();
  if (cfg.play === 'challenge') {
    const had = starsOf(stats.ch);
    stats.ch = Math.max(stats.ch, CHALLENGES[challenge].val());
    if (starsOf(stats.ch) > had) { // earned a star
      popup({ x: COLS / 2 - .5, y: ROWS / 2 - .5 }, '★'.repeat(starsOf(stats.ch)) + '!', '#ffe680');
      beep(988, .08); beep(1319, .08, .08); beep(1760, .14, .16);
    }
  }
  recording = false;

  const limit = timeLimit();
  if ((cfg.play !== 'versus' && !snakes.some(s => s.alive)) || (limit && elapsed >= limit)
      || (cfg.play === 'challenge' && starsOf(stats.ch) === 3)) gameOver();
  updateHud();
  sendState();
}

function eatApple(s, a) {
  s.fed = elapsed; s.hl = HUNGER_MS; // (hunger mode)
  if (a.shield) { // Shield mode: protects you from your next crash
    s.shield = true; s.eatFx = 1;
    burst(a, '#7fd4ff', 14, 3);
    popup(a, '+Shield', '#bfe9ff');
    beep(660, .06, 0, 'sine'); beep(880, .08, .06, 'sine'); beep(1320, .1, .12, 'sine');
    return;
  }
  if (a.key) { // Key mode: open every cage
    apples.forEach(o => { if (o.locked) { o.locked = false; burst(o, '#ffd54a', 10, 2.5); } });
    burst(a, '#ffd54a', 14, 3);
    popup(a, 'Unlocked!', '#ffe680');
    beep(660, .06, 0, 'triangle'); beep(990, .06, .06, 'triangle'); beep(1320, .1, .12, 'triangle');
    s.eatFx = 1;
    return;
  }
  if (G === 'statue') makeStatue(s);
  if (G === 'reverse') flipSnake(s);
  if (a.power) { // Power-up: a few seconds of something special, just for this snake
    s.power = a.power; s.pwEnd = elapsed + POWER_KINDS[a.power].ms; s.eatFx = 1;
    burst(a, POWER_KINDS[a.power].color, 18, 3.5);
    popup(a, POWER_KINDS[a.power].label, POWER_KINDS[a.power].color);
    beep(700, .07, 0, 'sine'); beep(1050, .07, .07, 'sine'); beep(1400, .1, .14, 'sine');
    return;
  }
  const pts = (a.gold ? GOLD_POINTS : 1) * (s.power === 'double' ? 2 : 1);
  s.apples += pts; score += pts; s.pending += a.gold ? GOLD_GROW : 1; s.eatFx = 1;
  addLife(1);
  stats.eaten++; if (a.gold) stats.golds++;
  burst(a, a.gold ? '#ffd54a' : '#e7471d', a.gold ? 24 : 12, a.gold ? 4 : 3);
  popup(a, '+' + pts, a.gold ? '#ffe680' : '#fff');
  if (a.gold) { crunch(); beep(880, .06); beep(1175, .06, .06); beep(1568, .1, .12); }
  else { crunch(); beep(880, .05, .02, 'sine'); if (++goldCounter >= (cfg.play === 'challenge' && challenge === 'gold' ? 2 : GOLD_EVERY)) goldCounter = -1; }
  if (cfg.play === 'versus') return; // no teamwork bonus or rescues against each other
  // Teamwork bonus: you and a teammate eat within a moment of each other
  if (snakes.some(o => o !== s && tickNo - (lastEat[o.id] ?? -99) <= Math.round(TEAM_MS / TICK))) {
    score += TEAM_BONUS; stats.teamwork++; lastEat = [];
    popup({ x:a.x, y:a.y - .7 }, 'Teamwork +' + TEAM_BONUS, '#ffe680');
    beep(1320, .08, .12, 'triangle'); beep(1760, .14, .2, 'triangle');
  } else lastEat[s.id] = tickNo;
  // Co-op rescue: eating brings back the downed teammate with the longest wait left
  const mate = snakes.filter(o => !o.alive && o.respawn > 0).sort((p, q) => q.respawn - p.respawn)[0];
  if (mate && respawnSnake(mate)) {
    stats.rescues++;
    popup(mate.body[0], 'Rescued!', '#fff');
  }
}

function refillAfterEating(count) {
  while (normalApples() < cfg.apples) spawnApple();
  if (goldCounter === -1) { goldCounter = 0; if (!apples.some(a => a.gold)) spawnApple(true); }
  if (G === 'maze') for (let i = 0; i < count; i++) spawnRock();
  if (G === 'poison') movePoison();
  if (G === 'key') ensureKey();
  // Shield mode: a new shield shows up every few apples (only one on the board at a time)
  if (G === 'shield' && stats.eaten % SHIELD_EVERY === 0 && !apples.some(a => a.shield)) spawnApple('shield');
  if (stats.eaten > 0 && stats.eaten % POWER_EVERY === 0 && !apples.some(a => a.power)) spawnApple('power');
  if (G === 'speed') {
    // 4% faster per point, down to a limit
    TICK = Math.min(TICK, Math.max(55, Math.round(SPEEDS[cfg.speed] * Math.pow(.96, score))));
  }
}

// ---------- Turning ----------
// How far (0–1) the snakes are through the current move, as drawn on screen
const stepT = () => state === 'playing' ? Math.max(0, Math.min(1, (performance.now() - lastTick) / TICK)) : 0;

// Would moving `dir` next stop or kill snake s? Its head is held back instead of sliding into trouble.
function aheadBlocked(s, dir) {
  const b = s.body, next = dest(b[0], dir);
  if (s.safe > 0) return !inBounds(next); // see-through after a shield: only walls stop it
  if (s.power === 'ghost') return !inBounds(next) || rocks.some(r => eq(r, next)); // Ghost: only walls and rocks stop it
  if (boss) { const i = bossAt(next); if (i >= 0 && i < boss.body.length - 2) return true; } // (its tail is fair game)
  if (!inBounds(next) || rocks.some(r => eq(r, next)) || apples.some(a => (a.poison || a.locked) && eq(a, next))) return true;
  if (G === 'peaceful') return false;
  // A tail is safe to follow, since it moves out of the way on the same step (unless that snake is growing)
  const hits = o => o.body.some((c, i) => eq(c, next) && (o.pending > 0 || i < o.body.length - 1));
  return hits(s) || snakes.some(o => o !== s && o.alive && hits(o));
}

// Which move a new key press turns on: the square the head is drawn in. Once the head is most of the way
// into the next square, the turn happens there instead (earlier than that, the head glides back onto the new line).
const LATE_AT = .75;
function turnMove(s, n) {
  const late = !s.queue.length && stepT() >= LATE_AT && !aheadBlocked(s, s.dir);
  return n + 1 + s.queue.length + (late ? 1 : 0);
}

// Queue a turn for move number `at` (n = the last move made), going straight until then
function queueAt(s, dir, at, n) {
  const last = s.queue.length ? s.queue[s.queue.length - 1] : s.dir;
  if (dir === last || dir === OPP[last]) return false;
  while (s.queue.length < 2 && n + 1 + s.queue.length < at) s.queue.push(last);
  if (s.queue.length >= 3) return false;
  s.queue.push(dir);
  return true;
}

// Bodies a snake had at the end of each of its last k moves, newest first
// (null where it had only just come back to life, or null overall if we can't tell)
function pastBodies(s, k) {
  const out = [s.body];
  let b = s.body;
  for (let i = 0; i < k - 1; i++) {
    const r = s.log[i];
    if (!r) { while (out.length < k) out.push(null); break; }
    if (!r.ok) return null;
    b = b.slice(1);
    if (r.tail) b.push(r.tail);
    out.push(b);
  }
  return out;
}

// Online lag fix: redo snake s's last k moves as if it had turned to `dir` k moves ago.
// The host does this when the friend's key press arrives late, and the friend's game uses the same
// rules to show it straight away, so their snake turns exactly where they pressed.
// Returns null if that wouldn't be safe (then the turn just happens on the next move instead).
function replayTurn(s, k, dir) {
  if (!s.alive || s.queue.length || k < 1 || k > s.log.length) return null;
  if (dir === s.dir || dir === OPP[s.dir]) return null;
  const recent = s.log.slice(0, k);
  if (!recent.every(r => r.ok && !r.turn && !r.ate)) return null;
  const peaceful = G === 'peaceful';
  // Where every teammate was during those moves
  const mates = peaceful ? [] : snakes.filter(o => o !== s && o.alive).map(o => pastBodies(o, k));
  if (mates.includes(null)) return null;
  let body = s.body;
  for (const r of recent) { body = body.slice(1); if (r.tail) body.push(r.tail); }
  const log = [];
  let eat = false;
  for (let j = k - 1; j >= 0; j--) {
    const head = dest(body[0], dir);
    if (!inBounds(head) || rocks.some(c => eq(c, head)) || bossAt(head) >= 0) return null;
    body = [head, ...body];
    const tail = recent[j].tail ? body.pop() : null;
    if (!peaceful) {
      if (body.some((c, i) => i > 0 && eq(c, head))) return null;
      for (const m of mates) {
        const ob = m[j];
        if (ob && (ob.some(c => eq(c, head)) || body.some(c => eq(c, ob[0])))) return null;
      }
    }
    const apple = apples.find(a => eq(a, head));
    if (apple) { if (j > 0 || apple.poison || apple.locked) return null; eat = true; }
    log.unshift({ tail, turn: j === k - 1, ate: false, ok: true });
  }
  return { body, log: log.concat(s.log.slice(k)), eat };
}

// Host: the friend's turn was meant for a move that already happened
function lateTurn(slot, dir, at) {
  const s = snakeOf(slot), k = tickNo - at + 1;
  if (!s || k > maxRewind()) return false;
  const r = replayTurn(s, k, dir);
  if (!r) return false;
  s.body = r.body; s.dir = dir; s.log = r.log;
  const i = r.eat ? apples.findIndex(a => eq(a, s.body[0])) : -1;
  if (i >= 0) {
    recording = true;
    eatApple(s, apples.splice(i, 1)[0]);
    if (s.log[0]) s.log[0].ate = true; // (empty if Reverse mode just flipped it)
    refillAfterEating(1);
    recording = false;
  }
  updateHud();
  sendState();
  return true;
}

// Restart a CSS "bump" animation on an element
function bump(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
const shown = { score: 0, apples: {} };

function updateHud() {
  if (score > shown.score) bump($('score'));
  shown.score = score;
  for (const s of snakes) {
    if (s.apples > (shown.apples[s.id] ?? s.apples)) bump($('p' + (s.id + 1)));
    shown.apples[s.id] = s.apples;
  }
  $('score').textContent = score;
  for (let id = 0; id < MAX_PLAYERS; id++) {
    const s = snakeOf(id);
    $('pl' + (id + 1)).hidden = !s || state === 'ready' || uiMode === 'solo'; // like Google, the menu's top bar is just 🍎 and 🏆
    if (!s) continue;
    const down = !s.alive && state !== 'over';
    $('p' + (id + 1)).textContent = s.gone ? `${s.apples} · left` : down ? `${s.apples} · back in ${Math.ceil(s.respawn * TICK / 1000)}s` : s.apples;
    $('pl' + (id + 1)).classList.toggle('down', down);
  }
  // Someone who joins in the middle of a round watches until the next one
  const mine = snakeOf(mySlot);
  if (role === 'guest') $('hint').textContent = (!mine || mine.gone) && state !== 'ready' ? "👀 Watching — you'll join at the next round" : hintText();
  const limit = timeLimit();
  if (limit) {
    const left = Math.max(0, Math.ceil((limit - elapsed) / 1000));
    $('time').textContent = clock(left);
    $('time').classList.toggle('low', left <= 10);
    if (left <= 5 && left > 0 && left !== shown.time && state === 'playing') beep(880, .05, 0, 'sine');
    shown.time = left;
  }
  if (cfg.play === 'challenge') {
    const c = CHALLENGES[challenge], st = starsOf(stats.ch);
    $('goal').innerHTML = `${c.icon} ${stats.ch}/${goal[Math.min(2, st)]}${c.unit || ''} <span class="stars">${starText(st)}</span>`;
  }
  if (G === 'boss' && role !== 'guest') $('hint').textContent = hintText(); // (who's the boss right now)
  if (cfg.play === 'coop' && score > best) {
    best = score; $('best').textContent = best;
    try { localStorage.setItem(bestKey(), best); } catch (e) {}
  }
}

// ---------- Flow ----------
function beginGame() {
  musicStart();
  reset();
  bestAtStart = best;
  state = 'countdown'; countEnd = performance.now() + 1800; lastCount = 0;
  updateHud();
  overlay.classList.add('hidden');
  sendState();
}

function resume() {
  lastTick = performance.now() - pausedT * TICK;
  state = 'playing';
  overlay.classList.add('hidden');
  sendState();
}

function showOverlay(title, html, button, paused) {
  $('ovTitle').textContent = title;
  $('ovText').innerHTML = html;
  $('play').textContent = button;
  overlay.classList.toggle('paused', !!paused);
  overlay.classList.remove('hidden');
  renderMenu();
}

function introText() {
  if (uiMode === 'solo') return cfg.play === 'challenge' ? 'Beat a random challenge before time runs out — hit the targets for up to 3 ★!'
    : "Eat apples to grow longer — and don't crash!";
  if (cfg.play === 'versus') return `Every snake for itself! Most apples after ${clock(VERSUS_MS / 1000)} wins.<br>
    Crash and you shrink back to 3 and sit out for 3s.<br>Get someone to crash into you for +${CUT_BONUS}!`;
  if (cfg.play === 'challenge') return `Team up to beat a random challenge before time runs out.<br>
    Every round is a new goal — hit the targets for up to 3 ★!`;
  return INTRO;
}
function showIntro() {
  const wait = role === 'guest' && roomPublic ? '⏳ Waiting for the host to start the game…<br>' : '';
  showOverlay(uiMode === 'solo' ? 'Snake' : cfg.play === 'versus' ? 'Versus Snake' : 'Co-op Snake', wait + introText(), role === 'guest' ? 'Start' : 'Play');
}

const fanfare = () => { confetti(); beep(784, .1); beep(988, .1, .1); beep(1319, .2, .2); };
const dotOf = id => `<span class="dot" style="background:${skinHex(id)}"></span>`;

function showGameOver() {
  const time = clock(Math.round(elapsed / 1000));
  if (cfg.play === 'versus') return showVersusOver(time);
  if (cfg.play === 'challenge') return showChallengeOver(time);
  const isBest = score > 0 && score > bestAtStart, solo = uiMode === 'solo';
  if (isBest) fanfare();
  showOverlay(isBest ? 'New best! 🏆' : G === 'peaceful' ? 'Well played!' : 'Game over',
    `<span class="bigscore"><span>🍎<b>${score}</b></span><span>🏆<b>${best}</b></span></span>${solo ? '' : snakes.map(s => `${playerName(s.id)}: ${s.apples}`).join(' · ')}
     <span class="stats"><span>⏱ ${time}</span><span>📏 Longest ${stats.longest}</span>
     ${solo ? '' : `<span>🛟 Rescues ${stats.rescues}</span><span>🤝 Teamwork ${stats.teamwork}</span>`}
     ${G === 'boss' ? `<span>👹 Bosses beaten ${stats.bosses}</span>` : ''}</span>`,
    'Play again');
}

function showVersusOver(time) {
  const ranked = snakes.slice().sort((p, q) => q.apples - p.apples);
  const top = ranked[0].apples, winners = ranked.filter(s => s.apples === top);
  const tie = winners.length > 1, w = winners[0].id;
  if (!tie && (role === 'local' || w === me())) fanfare();
  else if (!tie) { beep(392, .15); beep(330, .25, .15); }
  const medal = s => ['🥇', '🥈', '🥉', '🎗'][ranked.findIndex(o => o.apples === s.apples)];
  showOverlay(tie ? "It's a tie!" : role !== 'local' && w === me() ? 'You win! 🏆' : `${playerName(w)} wins! 🏆`,
    `<span class="rank">${ranked.map(s => `<span>${medal(s)} ${dotOf(s.id)} ${playerName(s.id)} <b>${s.apples}</b></span>`).join('')}</span>
     <span class="stats"><span>⏱ ${time}</span><span>📏 Longest ${stats.longest}</span></span>`,
    'Rematch');
}

function showChallengeOver(time) {
  const c = CHALLENGES[challenge], st = starsOf(stats.ch), key = 'coopSnakeStars:' + challenge;
  let prev = 0;
  try { prev = +localStorage.getItem(key) || 0; } catch (e) {}
  if (st > prev) try { localStorage.setItem(key, st); } catch (e) {}
  if (st === 3 || st > prev) fanfare();
  showOverlay(['Challenge failed', 'Nice! ★', 'Great! ★★', 'Perfect! ★★★'][st],
    `${c.icon} <b>${c.name}</b> — you got <b>${stats.ch}${c.unit || ''}</b><br>
     <span class="stars" style="font-size:30px">${starText(st)}</span><br>
     <span class="targets">Targets: ★ ${goal[0]} · ★★ ${goal[1]} · ★★★ ${goal[2]}${c.unit || ''} ·
       ${st > prev && prev ? 'new best!' : `best ${starText(Math.max(st, prev))}`}</span>
     <span class="stats"><span>⏱ ${time}</span><span>🍎 Score ${score}</span><span>📏 Longest ${stats.longest}</span>
     <span>🛟 Rescues ${stats.rescues}</span><span>🤝 Teamwork ${stats.teamwork}</span></span>`,
    'Next challenge');
}

// A shower of confetti over the board (used for a new best score)
function confetti() {
  const box = $('fx'), colors = ['#ffd54a', '#e7471d', '#4e7cf6', '#a855f7', '#14b8a6', '#ec4899', '#ffffff'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('span'), dur = rand(1.4, 2.6);
    c.className = 'confetti';
    c.style.left = rand(0, 100) + '%';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = dur + 's';
    c.style.animationDelay = rand(0, .5) + 's';
    c.style.setProperty('--dx', rand(-60, 60) + 'px');
    c.style.setProperty('--dy', box.clientHeight + 30 + 'px');
    c.style.setProperty('--rot', rand(-720, 720) + 'deg');
    box.appendChild(c);
    setTimeout(() => c.remove(), (dur + .6) * 1000);
  }
}

// ---------- Replay: the last game is recorded a step at a time, so you can watch it back ----------
let frames = [], rep = null;
const FRAME_CAP = 2400; // about 5 minutes of play; older steps are dropped
function recordFrame() {
  if (role === 'guest' || state === 'replay') return;
  frames.push(JSON.stringify({ s: snakes.map(s => ({ id:s.id, body:s.body, dir:s.dir, alive:s.alive, apples:s.apples, power:s.power || null,
      pwEnd:s.pwEnd || 0, shield:!!s.shield, safe:s.safe || 0, gone:!!s.gone, moves:s.moves, hl:s.hl })),
    a: apples, r: rocks, st: statues, p: portals, b: boss, sc: score, el: elapsed }));
  if (frames.length > FRAME_CAP) frames.shift();
}
function applyFrame(f) {
  const d = JSON.parse(f);
  snakes = d.s.map(x => ({ ...makeSnake(x.id, 0), ...x, queue: [], log: [], fresh: false, eatFx: 0, respawn: 0, pending: 0, blocked: false }));
  apples = d.a; rocks = d.r; statues = d.st; portals = d.p; boss = d.b; score = d.sc; elapsed = d.el;
}
function startReplay() {
  if (!frames.length || rep || role === 'guest') return;
  rep = { i: 0, timer: 0 };
  state = 'replay'; overlay.classList.add('hidden');
  $('hint').textContent = '▶ Replay — click the board or press Space to stop';
  rep.timer = setInterval(() => {
    if (rep.i >= frames.length) return stopReplay();
    applyFrame(frames[rep.i++]);
  }, TICK);
}
function stopReplay() {
  if (!rep) return;
  clearInterval(rep.timer); rep = null;
  applyFrame(frames[frames.length - 1]); // back to the final board
  state = 'over';
  $('hint').textContent = hintText();
  showGameOver(); addOverExtras();
}
canvas.addEventListener('click', () => { if (state === 'replay') stopReplay(); });
overlay.addEventListener('click', e => { if (e.target.closest('[data-replay]')) startReplay(); });

// ---------- Daily game: everyone gets the same game each day (scores are kept on this computer) ----------
const DAILY_GAMES = ['classic', 'maze', 'portal', 'poison', 'speed', 'statue', 'light', 'magnet', 'key', 'boss', 'shield', 'squeeze', 'hunger', 'runaway', 'reverse'];
let dailyDate = null;
function todayKey() { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
function dailyGameFor(key) { let h = 0; for (const ch of key) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return DAILY_GAMES[h % DAILY_GAMES.length]; }
function dailyBestOf() {
  try { const d = JSON.parse(localStorage.getItem('coopSnakeDaily') || 'null'); return d && d.date === todayKey() ? d.best : 0; } catch (e) { return 0; }
}
function recordDaily() {
  if (!dailyDate) return;
  try { localStorage.setItem('coopSnakeDaily', JSON.stringify({ date: todayKey(), best: Math.max(dailyBestOf(), score) })); } catch (e) {}
}
// The buttons under the game-over score
function addOverExtras() {
  let extra = '';
  if (frames.length > 1 && role !== 'guest') extra += `<div class="btns" style="margin-top:6px"><button class="btn2" data-replay>▶ Watch replay</button></div>`;
  if (dailyDate) extra += `<div class="small">📅 Today's best: <b>${dailyBestOf()}</b></div>`;
  $('ovText').insertAdjacentHTML('beforeend', extra);
}

function gameOver() {
  state = 'over'; overAt = performance.now();
  recordFrame(); recordDaily();
  showGameOver(); addOverExtras(); sendState();
}
function endGame() { if (state === 'playing' || state === 'paused') gameOver(); }

function togglePause() {
  if (state === 'playing') {
    pausedT = Math.min(1, (performance.now() - lastTick) / TICK);
    state = 'paused';
    showOverlay('Paused', 'Press Space to resume', 'Resume', true);
    sendState();
  } else if (state === 'paused') resume();
}

// A local game pauses itself when you switch away (online games keep going, since your friend is still playing)
const awayFromGame = () => document.hidden;
const pauseIfAway = () => { if (role === 'local' && state === 'playing') togglePause(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseIfAway(); });
addEventListener('blur', pauseIfAway);

// Stops a new game starting by accident while you're still mashing keys after a crash
const canRestart = () => state !== 'over' || performance.now() - overAt > 700;

function spaceAction() {
  if (state === 'replay') return stopReplay();
  if (state === 'playing' || state === 'paused') togglePause();
  else if (state === 'ready' || (state === 'over' && canRestart())) beginGame();
}

function steer(player, dir) {
  if (state === 'ready' || state === 'over') {
    if (!canRestart()) return;
    beginGame();
    // Like Google's snake: on one keyboard, the first arrow press starts straight away (no countdown)
    if (role === 'local') countEnd = performance.now();
  }
  if (state !== 'playing' && state !== 'countdown') return;
  const s = snakeOf(player);
  if (s && s.alive) queueAt(s, dir, turnMove(s, tickNo), tickNo);
}

// ---------- Input (keyboard, touch, controllers, buttons) ----------
const me = () => role === 'guest' ? mySlot : 0;
// Online: my second player's slot on this keyboard (-1 = none)
const second = () => role === 'host' ? (seat2[0] ?? -1) : role === 'guest' ? mySlot2 : -1;
// Online: which slot local player p (0 = WASD side, 1 = arrows side) steers. With one player, any keys steer you.
const localSlot = p => p === 1 && second() >= 0 ? second() : me();
const friendCount = () => Object.values(conns).filter(c => c.open).length;
const connected = () => role === 'host' ? friendCount() > 0 : !!(conn && conn.open);

function playerSteer(p, dir) {
  if (role === 'guest') guestSteer(dir, p === 1 && mySlot2 >= 0 ? 1 : 0);
  else if (role === 'host') { if (connected()) steer(localSlot(p), dir); }
  else if (uiMode === 'local') steer(p, dir);
  else if (uiMode === 'solo') steer(0, dir); // (arrows and WASD both steer you)
}

function pressPause() {
  if (role === 'guest') { if (connected()) send({ t:'space' }); return; }
  if (uiMode === 'online' && !connected()) return;

}

function pressStart() {
  if (role === 'guest') { if (connected()) send({ t:'start' }); return; }
  if (uiMode === 'online' && !connected()) return;
  if (state === 'paused') resume();
  else if (state === 'ready' || state === 'over') beginGame();
}

function pressQuit() {
  if (role === 'guest') { if (connected()) send({ t:'quit' }); return; }

}

function showEmote(p, i) {
  const now = performance.now(), L = looks[p];
  if (now - L.lastEmote < 450) return false; // no spamming
  L.lastEmote = now; L.emote = i; L.emoteAt = now;
  beep(1100 + i * 90, .05, 0, 'sine');
  return true;
}

function pressEmote(p, i) {
  const slot = localSlot(p);
  if (role === 'guest') { if (connected() && showEmote(slot, i)) send({ t:'emote', i, who: slot === mySlot2 ? 1 : 0 }); }
  else if (role === 'host') { if (connected() && showEmote(slot, i)) send({ t:'emote', p:slot, i }); }

function toggleMute() {

// Touch: local = left half P1 / right half P2; online = anywhere steers your own snake
const touches = {};
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) touches[t.identifier] = { x: t.clientX, y: t.clientY, p: t.clientX < innerWidth / 2 ? 0 : 1 };
}, { passive:false });

  e.preventDefault();
  for (const t of e.changedTouches) {
    const s = touches[t.identifier];
    if (!s) continue;
    const dx = t.clientX - s.x, dy = t.clientY - s.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) continue;
    playerSteer(s.p, Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    s.x = t.clientX; s.y = t.clientY;
  }
}, { passive:false });
canvas.addEventListener('touchend', e => { for (const t of e.changedTouches) delete touches[t.identifier]; });

// Controllers: first pad is P1 and second is P2 (online, any pad steers you).
// D-pad or left stick steers, Start pauses, A starts/resumes, A/B/X/Y send emotes while playing.
const padPrev = {};
let padsSeen = false;
addEventListener('gamepadconnected', () => { padsSeen = true; });
function pollPads() {
  if (!padsSeen || !navigator.getGamepads) return;
  let pads;
  try { pads = [...navigator.getGamepads()].filter(p => p && p.connected); } catch (e) { return; }
  pads.forEach((p, order) => {
    const prev = padPrev[p.index] || (padPrev[p.index] = { dir:null, btn:[] });
    const player = Math.min(order, 1); // (online, playerSteer/pressEmote map this to your own snake)
    const down = i => !!(p.buttons[i] && p.buttons[i].pressed);
    let dir = down(12) ? 'up' : down(13) ? 'down' : down(14) ? 'left' : down(15) ? 'right' : null;
    if (!dir) {
      const x = p.axes[0] || 0, y = p.axes[1] || 0, ax = Math.abs(x), ay = Math.abs(y);
      // Near a diagonal, keep the previous direction so a wobbly stick doesn't flip back and forth
      if (Math.max(ax, ay) > .5) dir = Math.abs(ax - ay) < .2 ? prev.dir : ax > ay ? (x > 0 ? 'right' : 'left') : (y > 0 ? 'down' : 'up');
    }
    if (dir && dir !== prev.dir) playerSteer(player, dir);
    prev.dir = dir;
    const pressed = i => down(i) && !prev.btn[i];
    if (pressed(9)) pressPause();
    for (let i = 0; i < 4; i++) if (pressed(i)) {
      if (state === 'playing' || state === 'countdown') pressEmote(player, i);
      else if (i === 0 && canRestart()) pressStart();
    }
    prev.btn = p.buttons.map(b => b.pressed);
  });
}

function makeCode() {
  const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  // Secure random so codes can't be predicted
  return Array.from(crypto.getRandomValues(new Uint32Array(6)), n => A[n % A.length]).join('');
}

// Invite links only make sense when the game is on a website (like GitHub Pages)
const canInvite = /^https?:$/.test(location.protocol);
function waitingStatus(prefix) {

       : `<br>Send the ${canInvite ? 'link or code' : 'code'} to up to ${MAX_PLAYERS - 1} friends. Waiting for them to join…`));
}
// Host: remove a player from the room (and keep them from coming straight back)
function kickSlot(slot) {
  const c = conns[slot];
  if (role !== 'host' || !c) return;
  if (c.peer) kickedPeers.add(c.peer);
  sendTo(c, { t: 'kicked' });

}

// Host: a player slot is no longer in use. Mid-round its snake stays as a ghost; otherwise the menu updates.
function dropSlot(x) {
  const s = snakeOf(x);
  if (s && (state === 'playing' || state === 'paused' || state === 'countdown')) {
    Object.assign(s, { alive:false, respawn:0, gone:true, queue:[] });
    if (cfg.play !== 'versus' && !snakes.some(o => o.alive)) gameOver();
  } else { state = 'ready'; reset(); showIntro(); }
}

// Host: give (or take back) a second snake for the computer playing `slot` (0 = the host's own keyboard)
function hostSetTwo(slot, on, skin) {
  if (on && seat2[slot] === undefined) {
    const x = freeSlot();
    if (x === undefined) {
      if (slot === 0) { wantTwo = false; renderMenu(); waitingStatus('The room is full — no space for a second player. '); }
      else sendTo(conns[slot], { t:'nofree' });
      return;
    }
    seat2[slot] = x; skins[x] = validSkin(skin, DEFAULT_SKINS[x]);
    if (state === 'ready' || state === 'over') { state = 'ready'; reset(); showIntro(); }
  } else if (!on && seat2[slot] !== undefined) {
    const x = seat2[slot];
    delete seat2[slot];
    dropSlot(x);
  } else return;
  fixClash(); applySkins();
  if (peer && peer.open) waitingStatus();
  updateHud(); sendState(); postRoom();
}

function guestId() {
  try {
    let g = localStorage.getItem('coopSnakeGuestId');
    if (!/^[a-z0-9]{16}$/.test(g || '')) {
      const A = 'abcdefghijklmnopqrstuvwxyz0123456789';
      g = Array.from(crypto.getRandomValues(new Uint32Array(16)), n => A[n % A.length]).join('');
      localStorage.setItem('coopSnakeGuestId', g);
    }
    return PEER_PREFIX + 'g-' + g;
  } catch (e) { return undefined; } // (no storage: a random ID is picked instead)
}

const NO_LIB ="Couldn't load the online library. Check your internet connection (some school or work networks block it).";

async function hostGame(isPublic) {
  if (!window.Peer) {
    setStatus('Loading the online library…');
    if (!(await loadPeerLib())) return setStatus(NO_LIB);
  }
  if (peer) try { peer.destroy(); } catch (e) {}
  role = 'host'; roomCode = makeCode(); conn = null; pingMs = null; signalLost = false;
  publicRoom = isPublic === true; listedAt = -1e9; kickedPeers.clear();
  roomName = [Math.random() * ADJS.length | 0, Math.random() * ANIMALS.length | 0];
  for (const k in conns) delete conns[k];
  for (const k in pings) delete pings[k];
  for (const k in seat2) delete seat2[k];
  if (wantTwo) seat2[0] = 1;
  skins = startingSkins(); fixClash();
  state = 'ready'; reset(); showIntro();
  setStatus('Creating room…'); applySkins();
  const myPeer = peer = new Peer(PEER_PREFIX + roomCode, peerOpts());
  setTimeout(() => { if (peer === myPeer && !myPeer.open && role === 'host') leaveOnline("Couldn't reach the matchmaking server. Check your internet connection and try again."); }, 15000);
  keepSignalling(myPeer, () => peer === myPeer);
  peer.on('open', () => { waitingStatus(); postRoom(); });
  peer.on('connection', c => {
    // Each friend gets the lowest free player slot
    const slot = freeSlot();
    // (a few half-finished connections at most, so nobody can tie up the room just by knocking)
    const waiting = Object.values(conns).filter(x => !x.open).length;
    if (kickedPeers.has(c.peer)) { // (tell them why, then close)
      c.on('open', () => { sendTo(c, { t: 'kicked' }); setTimeout(() => { try { c.close(); } catch (e) {} }, 300); });
      return;
    }
    if (slot === undefined || waiting >= 3) {
      if (slot === undefined) c.on('open', () => { c.send({ t:'full' }); setTimeout(() => c.close(), 300); });
      else try { c.close(); } catch (e) {}
      return;
    }
    conns[slot] = c;
    // A connection that never finishes opening gives its slot back (instead of holding it forever)
    const stale = setTimeout(() => { if (conns[slot] === c && !c.open) { delete conns[slot]; try { c.close(); } catch (e) {} } }, 20000);
    c.on('open', () => {
      clearTimeout(stale);
      if (conns[slot] !== c) return;
      lastSeq[slot] = 0; lastHeard[slot] = performance.now();
      skins[slot] = { ...DEFAULT_SKINS[slot] }; fixClash(); applySkins();
      // In the menu, the new snake appears straight away; mid-game, they join at the next round
      if (state === 'ready' || state === 'over') { state = 'ready'; reset(); showIntro(); }
      waitingStatus();
      renderMenu(); sendState(); postRoom();
    });
    c.on('data', m => { if (conns[slot] === c) { lastHeard[slot] = performance.now(); onHostData(slot, m); } });
    c.on('error', () => {});
    c.on('close', () => {
      clearTimeout(stale);
      if (conns[slot] !== c) return;
      const two = seat2[slot];
      delete conns[slot]; delete pings[slot]; delete seat2[slot];
      if (role !== 'host') return;
      postRoom();
      if (!friendCount()) { state = 'ready'; reset(); showIntro(); waitingStatus('Everyone left. '); return; }
      // Their snake(s) stay as ghosts for this round
      dropSlot(slot);
      if (two !== undefined) dropSlot(two);
      waitingStatus(`P${slot + 1} left. `);
      updateHud(); sendState();
    });
  });
  peer.on('error', e => {
    if (peer !== myPeer) return;
    if (e.type === 'unavailable-id') return hostGame(publicRoom); // (the random code was taken: pick another)
    if (e.type === 'peer-unavailable') return;
    // Real problems end the room; a hiccup with the matchmaking server just means reconnecting (keepSignalling does that)
    if (['browser-incompatible', 'invalid-id', 'invalid-key', 'ssl-unavailable', 'webrtc'].includes(e.type))
      leaveOnline(`Online error (${e.type}). Try again.`);
  });
}

async function joinGame(code, attempt = 1) {
  code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 6) return setStatus('Enter the 6-character room code.');
  if (document.activeElement) document.activeElement.blur(); // so the keys steer instead of typing
  if (!window.Peer) {
    setStatus('Loading the online library…');
    if (!(await loadPeerLib())) return setStatus(NO_LIB);
  }
  if (peer) try { peer.destroy(); } catch (e) {}
  role = 'guest'; roomCode = code; inputSeq = 0; unacked = []; conn = null; signalLost = false; roomPublic = false;
  inbox = []; lastN = -1; pingMs = null; mySlot = 1; mySlot2 = -1;
  skins = copySkins();
  setStatus(attempt > 1 ? `Trying again to reach room <b>${code}</b>…` : `Connecting to room <b>${code}</b>… (this can take up to 20 seconds)`);
  applySkins();
  // A steady random ID for this browser (so a kick from a room holds); a fresh one on the retry, in case it's in use in another tab
  const myPeer = peer = new Peer(attempt === 1 ? guestId() : undefined, peerOpts());
  let finished = false;
  // Couldn't connect: try once more (a room that was only just created, or a hiccup, often works the second time)
  const giveUp = why => {
    if (finished || peer !== myPeer) return;
    finished = true; clearTimeout(timeout);
    if (attempt < 2) { try { myPeer.destroy(); } catch (e) {} setTimeout(() => { if (role === 'guest' && roomCode === code) joinGame(code, 2); }, why === 'notfound' ? 1500 : 0); return; }
    leaveOnline(why === 'notfound'
      ? `Room <b>${code}</b> not found. Check the code — the host may have left, or they may have an older version of the game (everyone press Ctrl+F5).`
      : `Couldn't connect to room <b>${code}</b>. Usually this means one of your networks blocks direct connections (some mobile data and school or work Wi-Fi do). Try another network, or ask your friend to join you instead.`);
  };
  const timeout = setTimeout(() => giveUp('timeout'), 20000);
  peer.on('open', () => {
    const c = conn = peer.connect(PEER_PREFIX + code, { reliable: true, serialization: 'json' });
    c.on('open', () => {
      finished = true; clearTimeout(timeout); lastHostMsg = performance.now();
      forceOverlay = true;
      setStatus(`Connected to room <b>${code}</b>! Waiting for the host to start…`);
      renderMenu();
      send({ t:'ping', ts: performance.now() });
      send({ t:'skin', c: savedSkins.online.c, p: savedSkins.online.p });
      if (wantTwo) send({ t:'two', on:true, c: savedSkins.online2.c, p: savedSkins.online2.p });
    });
    c.on('data', m => {
      lastHostMsg = performance.now();
      if (!m || typeof m !== 'object') return;
      if (m.t === 'state') {
        const clean = cleanState(m);
        if (!clean) return;
        clean.at = performance.now();
        inbox.push(clean);
        if (inbox.length > 30) inbox.splice(0, inbox.length - 30);
        pumpInbox();
      } else if (m.t === 'emote') {
        if (isIdx(m.p, MAX_PLAYERS) && m.p !== mySlot && m.p !== mySlot2 && isIdx(m.i, EMOTES.length)) showEmote(m.p, m.i);
      } else if (m.t === 'pong') {
        const rtt = performance.now() - m.ts;
        if (Number.isFinite(rtt) && rtt >= 0 && rtt < 60000) { pingMs = Math.round(rtt); renderPing(); }
      } else if (m.t === 'full') leaveOnline('That room is already full.');
      else if (m.t === 'kicked') leaveOnline('The host removed you from the room.');
      else if (m.t === 'nofree') { wantTwo = false; renderMenu(); setStatus(`Connected to room <b>${code}</b>. The room is full, so there's no space for a second player.`); }
    });
    c.on('error', () => giveUp('error'));
    c.on('close', () => {
      if (!finished) return giveUp('closed'); // it never got connected
      if (role === 'guest' && conn === c) leaveOnline('Disconnected from the host.');
    });
  });
  peer.on('error', e => {
    if (peer !== myPeer || finished) return; // after connecting, only the game connection matters
    giveUp(e.type === 'peer-unavailable' ? 'notfound' : 'error');
  });
}

function leaveOnline(msg) {
  const oldConn = conn, oldPeer = peer;
  if (role === 'host') unpostRoom();
  role = 'local'; conn = null; peer = null; pingMs = null; inbox = []; lastN = -1; mySlot2 = -1; publicRoom = false; roomPublic = false;
  for (const k in seat2) delete seat2[k];
  try { oldConn && oldConn.close(); } catch (e) {}
  try { oldPeer && oldPeer.destroy(); } catch (e) {}
  for (const k in conns) { try { conns[k].close(); } catch (e) {} delete conns[k]; }
  for (const k in pings) delete pings[k];
  cfg = loadCfg();
  skins = startingSkins();
  fixClash();
  state = 'ready'; reset(); showIntro(); applySkins();
  setStatus(msg || ''); renderPubNote();
}

// ---------- Connection helpers ----------
// More than one STUN server (they help two players behind routers find each other). All of these were checked.
const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'stun:stun2.l.google.com:19302' },
  { urls: 'stun:stun.cloudflare.com:3478' }, { urls: 'stun:global.stun.twilio.com:3478' }, { urls: 'stun:stun.nextcloud.com:443' },
];
const peerOpts = () => ({ debug: 0, config: { iceServers: ICE_SERVERS, iceCandidatePoolSize: 4 } });

// If the connection to the matchmaking server drops, keep trying to get it back (with growing pauses).
// (A host who loses it can't be found by new players, but the players already in the room are fine.)
let signalLost = false;
function keepSignalling(p, isCurrent) {
  let tries = 0;
  p.on('open', () => { tries = 0; if (isCurrent() && p === peer && signalLost) { signalLost = false; if (role === 'host') waitingStatus(); } });
  p.on('disconnected', () => {
    if (isCurrent() && p === peer) { signalLost = true; if (role === 'host') waitingStatus('⚠ Lost contact with the matchmaking server — reconnecting… '); }
    const again = () => {
      if (!isCurrent() || p.destroyed || !p.disconnected) return;
      try { p.reconnect(); } catch (e) {}
      setTimeout(again, Math.min(10000, 1500 * ++tries));
    };
    setTimeout(again, 500);
  });
}

// ---------- Public lobby ----------
// There's no game server, so a couple of players' browsers keep the list of public rooms (the "keepers"):
// each claims a lobby ID, everyone else in the online menu connects to read the list, and public hosts post
// their room every few seconds. There are two lobbies, usually kept by different people, so one person's
// bad connection can't break the list for everybody. If a keeper leaves, someone else takes over.
// Rooms only have made-up names picked from the lists below (no typed text), and everything is checked.
const ADJS = ['Happy', 'Speedy', 'Sneaky', 'Brave', 'Sleepy', 'Jolly', 'Mighty', 'Tiny', 'Fuzzy', 'Lucky', 'Wiggly', 'Sunny'];
const ANIMALS = ['Snakes', 'Pythons', 'Cobras', 'Vipers', 'Worms', 'Lizards', 'Geckos', 'Newts', 'Frogs', 'Turtles', 'Dragons', 'Eels'];
const PLAY_NAMES = { coop:'Co-op', challenge:'Challenges', versus:'Versus' };
const roomTitle = n => `${ADJS[n[0]]} ${ANIMALS[n[1]]}`;
const CODE_RE = /^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{6}$/;
const ROOM_TTL = 10000; // a room that hasn't posted for this long is dropped from the list
let publicRoom = false, roomName = [0, 0], listedAt = -1e9;
const lobbies = [0, 1].map(i => ({ id: `${PEER_PREFIX}lobby-${i}`, peer: null, conn: null, keeper: false, claiming: false,
  rooms: [], online: 1, tries: 0, timer: null, links: 0, linkSet: new Set(), heard: 0, kept: new Map() }));
const keeperCount = () => lobbies.filter(L => L.keeper || L.claiming).length;
const lobbyReady = L => L.keeper || !!(L.conn && L.conn.open);
const anyLobbyReady = () => lobbies.some(lobbyReady);

function cleanRoom(r) {
  if (!r || typeof r !== 'object' || typeof r.code !== 'string' || !CODE_RE.test(r.code)) return null;
  const n = arr(r.name, 2);
  if (!isIdx(n[0], ADJS.length) || !isIdx(n[1], ANIMALS.length)) return null;
  return { code: r.code, name: [n[0], n[1]], n: int(r.n, 1, MAX_PLAYERS), game: has(GAMES, r.game) ? r.game : 'classic',
           play: has(PLAYS, r.play) ? r.play : 'coop', live: r.live === true };
}
function keptList(L) {
  const now = performance.now();
  for (const [k, r] of L.kept) if (now - r.at > ROOM_TTL) L.kept.delete(k);
  return [...L.kept.values()].map(cleanRoom).filter(Boolean).slice(0, 30);
}
// Every public room from every lobby I can see (without my own)
function allRooms() {
  const seen = new Map();
  for (const L of lobbies) for (const r of (L.keeper ? keptList(L) : L.rooms)) if (r.code !== roomCode && !seen.has(r.code)) seen.set(r.code, r);
  return [...seen.values()];
}

function lobbyStopPeer(L) {
  const p = L.peer;
  L.peer = null; L.conn = null; L.keeper = false; L.claiming = false; L.links = 0; L.linkSet.clear(); L.kept.clear();
  try { p && p.destroy(); } catch (e) {}
}
function lobbyStopAll() { for (const L of lobbies) { lobbyStopPeer(L); clearTimeout(L.timer); L.timer = null; L.tries = 0; L.rooms = []; } }
// Try again a bit later (a random wait, so everyone doesn't grab the lobby at the same moment)
function lobbyRetry(L) {
  lobbyStopPeer(L);
  clearTimeout(L.timer);
  L.timer = setTimeout(() => { L.timer = null; lobbyStart(L); }, Math.min(15000, 800 * 2 ** L.tries++) * rand(.6, 1.3));
  renderLobby();
}
function lobbyStartAll() { for (const L of lobbies) lobbyStart(L); }

function lobbyStart(L) {
  if (L.peer || L.timer || !window.Peer || uiMode !== 'online') return;
  // One person keeps at most one lobby (so the keepers are different people), unless this one has been empty a while
  if (keeperCount() >= 1 && L.tries < 2) return lobbyJoin(L);
  L.claiming = true;
  const p = L.peer = new Peer(L.id, peerOpts());
  setTimeout(() => { if (L.peer === p && !L.keeper) lobbyRetry(L); }, 12000);
  p.on('open', () => { if (L.peer !== p) return; L.keeper = true; L.claiming = false; L.tries = 0; renderLobby(); postRoom(); });
  p.on('connection', c => keeperLink(L, c));
  p.on('error', e => {
    if (L.peer !== p) return;
    L.claiming = false;
    if (e.type === 'unavailable-id') { lobbyStopPeer(L); lobbyJoin(L); } // someone else keeps it: read it from them
    else if (!L.keeper) lobbyRetry(L);
  });
  keepSignalling(p, () => L.peer === p);
}

function lobbyJoin(L) {
  if (L.peer || !window.Peer) return;
  const p = L.peer = new Peer(peerOpts());
  const bail = () => { if (L.peer === p) lobbyRetry(L); };
  // If any step just hangs, give up and try again rather than waiting forever
  setTimeout(() => { if (L.peer === p && !lobbyReady(L)) bail(); }, 14000);
  p.on('open', () => {
    if (L.peer !== p) return;
    const c = L.conn = p.connect(L.id, { reliable: true, serialization: 'json' });
    c.on('open', () => { L.tries = 0; L.heard = performance.now(); lobbyAsk(L); postRoom(); renderLobby(); });
    c.on('data', m => {
      if (L.conn !== c || !m || typeof m !== 'object') return;
      L.heard = performance.now();
      if (m.t === 'listed') { if (m.code === roomCode) { listedAt = performance.now(); renderPubNote(); } return; }
      if (m.t !== 'rooms') return;
      L.rooms = arr(m.rooms, 30).map(cleanRoom).filter(Boolean);
      L.online = int(m.online, 1, 9999);
      renderLobby();
    });
    c.on('close', bail); // the keeper left: try to take over
    c.on('error', bail);
  });
  p.on('error', bail);
  keepSignalling(p, () => L.peer === p);
}

// Keeper: someone connected to the lobby
function keeperLink(L, c) {
  if (L.links >= 200) { setTimeout(() => { try { c.close(); } catch (e) {} }, 0); return; }
  L.links++; L.linkSet.add(c);
  c.budget = 5; c.at = c.seen = performance.now();
  c.on('data', m => { c.seen = performance.now(); keeperData(L, c, m); });
  c.on('close', () => {
    L.links--; L.linkSet.delete(c);
    for (const [k, r] of L.kept) if (r.by === c.peer) L.kept.delete(k);
    renderLobby();
  });
}
// Keeper: messages from someone in the lobby (untrusted, and limited to a few per second)
function keeperData(L, c, m) {
  const now = performance.now();
  c.budget = Math.min(5, c.budget + (now - c.at) / 1000 * 3); c.at = now;
  if (c.budget < 1 || !m || typeof m !== 'object') return;
  c.budget--;
  if (m.t === 'list') sendTo(c, { t: 'rooms', rooms: keptList(L), online: 1 + L.links });
  else if (m.t === 'post') {
    const r = cleanRoom(m.room);
    if (!r) return;
    const old = L.kept.get(r.code);
    if (old && old.by !== c.peer) return; // only the room's own host can update it
    if (!old && L.kept.size >= 50) return;
    L.kept.set(r.code, { ...r, by: c.peer, at: now });
    sendTo(c, { t: 'listed', code: r.code }); // so the host can show that it worked
    renderLobby();
  } else if (m.t === 'gone' && typeof m.code === 'string') {
    const old = L.kept.get(m.code);
    if (old && old.by === c.peer) { L.kept.delete(m.code); renderLobby(); }
  }
}

function lobbyAsk(L) { if (L.conn && L.conn.open) sendTo(L.conn, { t: 'list' }); }

// Public host: put (or keep) my room in every lobby I can reach
function postRoom() {
  if (role !== 'host' || !publicRoom || !peer || !peer.open) return;
  const room = { code: roomCode, name: roomName, n: playerSlots().length, game: cfg.game, play: cfg.play,
                 live: state !== 'ready' && state !== 'over' };
  const now = performance.now();
  for (const L of lobbies) {
    if (L.keeper) { L.kept.set(roomCode, { ...room, by: 'me', at: now }); listedAt = now; }
    else if (L.conn && L.conn.open) sendTo(L.conn, { t: 'post', room });
  }
  renderLobby(); renderPubNote();
}
function unpostRoom() {
  if (!publicRoom) return;
  for (const L of lobbies) {
    if (L.keeper) L.kept.delete(roomCode);
    else if (L.conn && L.conn.open) sendTo(L.conn, { t: 'gone', code: roomCode });
  }
}
// Public host: show whether the room really is in the list right now
function renderPubNote() {
  const el = $('pubNote');
  el.hidden = !(role === 'host' && publicRoom);
  if (el.hidden) return;
  el.textContent = performance.now() - listedAt < 8000
    ? '✓ Listed in Public games — anyone in the Online menu can see it and join'
    : lobbies.every(L => L.tries > 2) ? "⚠ Can't reach the public list right now — retrying. Friends can still join with the code."
    : 'Adding your room to the public list…';
}

function lobbyStatus() {
  if (anyLobbyReady()) {
    const online = Math.max(...lobbies.filter(lobbyReady).map(L => L.keeper ? 1 + L.links : L.online));
    return `🟢 Connected · ${online} ${online === 1 ? 'player' : 'players'} in the lobby`;
  }
  return lobbies.every(L => L.tries > 2) ? "🟠 Can't reach the lobby right now — still trying. You can still join with a code."
    : '⏳ Connecting to the lobby…';
}
let lobbyHtml = '';
function renderLobby() {
  const rooms = allRooms();
  const html = `<h3>🌍 Public games <small style="opacity:.6;font-weight:400">· version ${GAME_VERSION}</small></h3>
    <div class="empty" style="margin-bottom:4px">${lobbyStatus()}</div>` + (rooms.length
    ? rooms.map(r => `<div class="room"><span><b>${roomTitle(r.name)}</b><br>
        <small>${GAME_NAMES[r.game]} · ${PLAY_NAMES[r.play]} · ${r.n}/${MAX_PLAYERS} players${r.live ? ' · playing now' : ''}</small></span>
        <button class="btn2" data-join="${r.code}"${r.n >= MAX_PLAYERS ? ' disabled' : ''}>${r.n >= MAX_PLAYERS ? 'Full' : 'Join'}</button></div>`).join('')
    : `<div class="empty">${anyLobbyReady() ? 'No public games right now — host one!' : 'Looking for games…'}</div>`);
  // (only redraw when something changed, so a click on "Join" isn't lost to a redraw in the middle of it)
  if (html !== lobbyHtml) { lobbyHtml = html; $('lobby').innerHTML = html; }
}
$('lobby').addEventListener('click', e => {
  const b = e.target.closest('[data-join]');
  if (b && !b.disabled && CODE_RE.test(b.dataset.join)) joinGame(b.dataset.join);
});

// Keep the lobby going while the online menu is open, and keep public rooms listed
function lobbyTick() {
  if (uiMode !== 'online') { if (lobbies.some(L => L.peer || L.timer)) lobbyStopAll(); return; }
  const now = performance.now();
  for (const L of lobbies) {
    if (!L.peer && !L.timer) lobbyStart(L);
    else if (L.keeper) {
      keptList(L);
      // anyone who has gone quiet (closed laptop, lost wifi...) is dropped, along with their room
      for (const c of [...L.linkSet]) if (now - c.seen > 12000) { try { c.close(); } catch (e) {} L.linkSet.delete(c); }
    } else if (L.conn && L.conn.open) {
      if (now - L.heard > 10000) lobbyRetry(L); // the keeper has gone quiet: reconnect (or take over)
      else lobbyAsk(L);                          // (this doubles as a "still here" signal)
    }
  }
  postRoom(); renderLobby(); renderPubNote();
}
// Coming back to this tab (or the network coming back): check everything right away
document.addEventListener('visibilitychange', () => { if (!document.hidden) lobbyTick(); });
addEventListener('online', lobbyTick);
// Browsers slow timers in tabs you aren't looking at, which can make the matchmaking server think we've left.
// This is called from the game's worker timer (which isn't slowed) and says "still here" every few seconds.
let lastBeat = 0;
function heartbeat(now) {
  if (now - lastBeat < 3000) return;
  lastBeat = now;
  for (const p of [peer, ...lobbies.map(L => L.peer)]) { try { if (p && p.open && p.socket) p.socket.send({ type: 'HEARTBEAT' }); } catch (e) {} }
  // In a game: a friend who has gone silent is gone (a closed laptop or lost wifi isn't noticed by the browser for a long time)
  if (role === 'guest' && connected()) {
    send({ t: 'ping', ts: now, rtt: pingMs });
    if (now - lastHostMsg > LIVE_MS) { leaveOnline('Lost connection to the host.'); return; }
  } else if (role === 'host') {
    for (const [slot, c] of Object.entries(conns)) if (c.open && now - (lastHeard[slot] || now) > LIVE_MS) { try { c.close(); } catch (e) {} }
  }
  lobbyTick();
}

// Quick play: join an open public game, or start one
function quickPlay() {
  const room = allRooms().find(r => r.n < MAX_PLAYERS);
  if (room) joinGame(room.code); else hostGame(true);
}

$('quickBtn').addEventListener('click', quickPlay);
$('dailyBtn').addEventListener('click', () => {
  if (role !== 'local') leaveOnline('');
  uiMode = 'solo'; lobbyStopAll();
  dailyDate = todayKey();
  const g = dailyGameFor(dailyDate);
