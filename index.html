<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Co-op Snake</title>
<!-- Pinned with a hash so a tampered copy from the CDN is refused -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"
  integrity="sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR"
  crossorigin="anonymous"></script>
<style>
  :root { --header:#4a752c; --border:#578a34; --p1:#4e7cf6; --p2:#a855f7; --p3:#f97316; --p4:#14b8a6; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#1c2616; font-family:Roboto, "Segoe UI", Arial, sans-serif; color:#fff;
    user-select:none; -webkit-user-select:none;
  }
  .wrap { width:min(94vw, 680px); padding:12px 0; }
  .hud {
    background:var(--header); display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:8px 12px 8px 18px; border-radius:10px 10px 0 0; font-size:22px; font-weight:700;
  }
  .hud .item { display:flex; align-items:center; gap:6px; }
  .hud .spacer { flex:1; }
  .hud .icon {
    background:none; border:0; color:#fff; font-size:17px; line-height:1; cursor:pointer;
    padding:6px; border-radius:6px; opacity:.85; display:flex; align-items:center;
  }
  .hud .icon:hover { background:rgba(255,255,255,.15); opacity:1; }
  .ping { font-size:12px; font-weight:600; opacity:.85; }
  .pl { font-size:14px; font-weight:600; display:flex; align-items:center; gap:6px; opacity:.95; }
  .pl.down { opacity:.6; }
  .dot { width:12px; height:12px; border-radius:50%; display:inline-block; flex:none; }
  .stage { position:relative; background:var(--border); padding:14px; border-radius:0 0 10px 10px; touch-action:none; }
  canvas { display:block; width:100%; height:auto; }
  .overlay {
    position:absolute; inset:14px; display:flex; background:rgba(20,40,10,.66);
    text-align:center; padding:12px; overflow:auto;
  }
  .overlay.hidden { display:none; }
  /* margin:auto centers the menu, but still lets it scroll from the top when it's taller than the board */
  .ov-inner { margin:auto; display:flex; flex-direction:column; align-items:center; gap:10px; max-width:100%; }
  .overlay h1 { margin:0; font-size:34px; }
  .overlay p { margin:0; font-size:15px; line-height:1.5; }
  .keys { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .keys div { background:rgba(0,0,0,.3); padding:8px 14px; border-radius:8px; font-size:14px; display:flex; align-items:center; gap:6px; }
  .settings { display:grid; grid-template-columns:auto auto; gap:6px 12px; align-items:center; font-size:14px; }
  .settings > span { text-align:right; opacity:.85; }
  .settings.locked .seg { opacity:.55; pointer-events:none; }
  .mode-desc { grid-column:1 / -1; font-size:12px; opacity:.85; max-width:380px; justify-self:center; line-height:1.4; }
  .seg { display:inline-flex; background:rgba(0,0,0,.3); border-radius:8px; padding:3px; }
  .seg[data-key="game"] { flex-wrap:wrap; justify-content:center; max-width:290px; }
  .seg button {
    background:none; border:0; color:#fff; font:inherit; font-size:13px; padding:5px 11px;
    border-radius:6px; cursor:pointer; opacity:.75;
  }
  .seg button.on { background:#fff; color:#2d4d1a; font-weight:700; opacity:1; }
  .modes button { font-size:14px; padding:6px 16px; }
  .paused .menu-only { display:none !important; }
  .overlay:not(.paused) .paused-only { display:none !important; }
  .online { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .online .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; }
  .btns { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .btn { background:#1a73e8; border:0; color:#fff; font-size:17px; font-weight:700; padding:10px 30px; border-radius:6px; cursor:pointer; }
  .btn:hover { background:#2b82f5; }
  .btn.secondary { background:rgba(0,0,0,.4); }
  .btn.secondary:hover { background:rgba(0,0,0,.55); }
  .btn2 { background:#fff; color:#2d4d1a; border:0; font-size:14px; font-weight:700; padding:8px 16px; border-radius:6px; cursor:pointer; }
  .btn2:hover { background:#e8f3dc; }
  .invite { font-size:12px; padding:5px 10px; margin-left:6px; vertical-align:middle; }
  .link { background:none; border:0; color:#fff; text-decoration:underline; opacity:.8; cursor:pointer; font-size:13px; }
  #codeIn {
    width:130px; font-size:18px; font-weight:700; letter-spacing:4px; text-transform:uppercase; text-align:center;
    padding:6px; border-radius:6px; border:0; background:rgba(0,0,0,.35); color:#fff; outline:none;
  }
  #codeIn:focus { box-shadow:0 0 0 2px #fff; }
  .status { font-size:14px; line-height:1.6; min-height:1em; }
  .code { font-size:24px; letter-spacing:5px; background:rgba(0,0,0,.35); padding:2px 12px; border-radius:6px; user-select:all; -webkit-user-select:all; }
  .skins { background:rgba(0,0,0,.28); border-radius:10px; padding:10px 14px; display:flex; flex-direction:column; gap:10px; }
  .skin-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; font-size:14px; }
  .skin-row b { min-width:34px; text-align:right; }
  .swatches { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .swatch {
    width:24px; height:24px; border-radius:50%; border:2px solid rgba(255,255,255,.3); padding:0; cursor:pointer;
  }
  .swatch.on { border-color:#fff; box-shadow:0 0 0 2px rgba(0,0,0,.4); transform:scale(1.12); }
  .swatch:disabled { opacity:.2; cursor:not-allowed; }
  .stats { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
  .stats span { background:rgba(0,0,0,.3); padding:4px 10px; border-radius:999px; font-size:13px; }
  .small { font-size:12px !important; opacity:.75; }
  .emotes { display:flex; justify-content:center; gap:10px; margin-top:8px; }
  .emotes button {
    font-size:22px; line-height:1; background:rgba(255,255,255,.08); border:0; border-radius:10px;
    padding:7px 12px; cursor:pointer;
  }
  .emotes button:hover { background:rgba(255,255,255,.18); }
  .hint { font-size:12px; opacity:.7; text-align:center; margin-top:8px; }
  @media (max-width:560px) {
    .overlay { padding:10px; }
    .ov-inner { gap:8px; }
    .overlay h1 { font-size:24px; }
    .overlay p { font-size:13px; }
    .hud { font-size:18px; padding:6px 8px 6px 12px; gap:8px; }
    .seg button { padding:4px 7px; font-size:12px; }
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="hud" id="hud">
    <div class="item" title="Team score">🍎 <span id="score">0</span></div>
    <div class="item" title="Best score">🏆 <span id="best">0</span></div>
    <div class="spacer"></div>
    <div class="pl" id="pl1"><span class="dot" style="background:var(--p1)"></span><span id="pn1">P1</span> <span id="p1">0</span></div>
    <div class="pl" id="pl2"><span class="dot" style="background:var(--p2)"></span><span id="pn2">P2</span> <span id="p2">0</span></div>
    <div class="pl" id="pl3" hidden><span class="dot" style="background:var(--p3)"></span><span id="pn3">P3</span> <span id="p3">0</span></div>
    <div class="pl" id="pl4" hidden><span class="dot" style="background:var(--p4)"></span><span id="pn4">P4</span> <span id="p4">0</span></div>
    <span class="ping" id="ping" title="Connection delay to your friend" hidden></span>
    <button class="icon" id="muteBtn" title="Sound on/off (M)" aria-label="Sound on/off">🔊</button>
    <button class="icon" id="fsBtn" title="Fullscreen (F)" aria-label="Fullscreen">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 5V1h4M11 1h4v4M15 11v4h-4M5 15H1v-4"/></svg>
    </button>
  </div>
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="overlay" id="overlay">
      <div class="ov-inner">
        <h1 id="ovTitle">Co-op Snake</h1>
        <p id="ovText"></p>
        <div class="seg modes menu-only" id="modeSeg">
          <button data-mode="local">Local (same keyboard)</button><button data-mode="online">Online</button>
        </div>
        <div class="online menu-only" id="onlinePanel" hidden>
          <div class="row" id="onIdle">
            <button class="btn2" id="hostBtn">Host a game</button>
            <span style="opacity:.7">or</span>
            <input id="codeIn" maxlength="6" placeholder="CODE" autocomplete="off" spellcheck="false">
            <button class="btn2" id="joinBtn">Join</button>
          </div>
          <div class="status" id="onStatus"></div>
          <button class="link" id="leaveBtn" hidden>Leave online game</button>
        </div>
        <div class="keys menu-only" id="keys"></div>
        <button class="btn2 menu-only" id="skinBtn">🎨 Snake looks</button>
        <div class="skins menu-only" id="skinPanel" hidden></div>
        <div class="settings menu-only" id="settings">
          <span>Mode</span>
          <div class="seg" data-key="game"><button data-v="classic">Classic</button><button data-v="maze">Maze</button><button data-v="peaceful">Peaceful</button><button data-v="poison">Poison</button><button data-v="portal">Portal</button><button data-v="speed">Speed-up</button></div>
          <span>Speed</span>
          <div class="seg" data-key="speed"><button data-v="slow">Slow</button><button data-v="normal">Normal</button><button data-v="fast">Fast</button></div>
          <span>Apples</span>
          <div class="seg" data-key="apples"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="5">5</button></div>
          <span>Board</span>
          <div class="seg" data-key="board"><button data-v="small">Small</button><button data-v="medium">Medium</button><button data-v="large">Large</button></div>
          <span>Edges</span>
          <div class="seg" data-key="mode"><button data-v="walls">Walls</button><button data-v="wrap">Wrap around</button></div>
          <div class="mode-desc" id="modeDesc"></div>
        </div>
        <div class="btns">
          <button class="btn" id="play">Play</button>
          <button class="btn secondary paused-only" id="quit">End game</button>
        </div>
        <p class="small menu-only" id="help"></p>
      </div>
    </div>
  </div>
  <div class="emotes" id="emoteBar" hidden>
    <button data-e="0" title="Key 1" aria-label="Thumbs up">👍</button>
    <button data-e="1" title="Key 2" aria-label="Laughing">😂</button>
    <button data-e="2" title="Key 3" aria-label="Shocked">😱</button>
    <button data-e="3" title="Key 4" aria-label="Help">🆘</button>
  </div>
  <div class="hint" id="hint"></div>
</div>

<script>
// ---------- Config ----------
const SPEEDS = { slow:180, normal:135, fast:95 };
const BOARDS = { small:[11,10], medium:[17,15], large:[24,21] };
const GAMES = {
  classic: "Crash and you're out for 3 seconds. If you're both down at once, it's game over.",
  maze: 'Every apple you eat drops a rock somewhere on the board. How long can you survive?',
  peaceful: 'Nobody can crash! Walls just stop you and you slide through snakes. Relax and eat.',
  poison: 'Dark ☠ apples are poison: eating one knocks you out. They jump to new spots whenever an apple is eaten.',
  portal: 'Two pairs of portals: go into one and you pop out of its twin, still heading the same way.',
  speed: 'Every point the team scores makes both snakes a little faster. How far can you push it?',
};
const CELL = 40, LIGHT = '#aad751', DARK = '#a2d149';
const DIRS = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
const OPP = { up:'down', down:'up', left:'right', right:'left' };
const KEYMAP = {
  KeyW:[0,'up'], KeyA:[0,'left'], KeyS:[0,'down'], KeyD:[0,'right'],
  ArrowUp:[1,'up'], ArrowLeft:[1,'left'], ArrowDown:[1,'down'], ArrowRight:[1,'right'],
};
const EMOTES = ['👍', '😂', '😱', '🆘'];
const EMOTE_KEYS = {
  Digit1:[0,0], Digit2:[0,1], Digit3:[0,2], Digit4:[0,3],
  Digit7:[1,0], Digit8:[1,1], Digit9:[1,2], Digit0:[1,3],
  Numpad1:[1,0], Numpad2:[1,1], Numpad3:[1,2], Numpad4:[1,3],
};
// Snake looks: a color plus a pattern for each player
const PALETTE = [
  { name:'blue', hex:'#4e7cf6' }, { name:'purple', hex:'#a855f7' }, { name:'orange', hex:'#f97316' },
  { name:'pink', hex:'#ec4899' }, { name:'teal', hex:'#14b8a6' }, { name:'yellow', hex:'#eab308' },
  { name:'slate', hex:'#475569' }, { name:'brown', hex:'#9a5b2e' },
];
const PATTERNS = { classic:'Classic', stripes:'Stripes', spots:'Spots', rainbow:'Rainbow' };
const validSkin = (k, dflt) => ({
  c: k && isIdx(k.c, PALETTE.length) ? k.c : dflt.c,
  p: k && has(PATTERNS, k.p) ? k.p : dflt.p,
});
const MAX_PLAYERS = 4;
const DEFAULT_SKINS = [{ c:0, p:'classic' }, { c:1, p:'classic' }, { c:2, p:'classic' }, { c:4, p:'classic' }];
// Mix two #rrggbb colors (t = how much of b)
function mix(a, b, t) {
  const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const GOLD_EVERY = 8, GOLD_MS = 6000, GOLD_POINTS = 5, GOLD_GROW = 3;
const TEAM_MS = 1500, TEAM_BONUS = 2, ROCK_MAX = .16, EMOTE_MS = 2200;
// How far back (in time) a late key press from an online friend can still count
const REWIND_MS = 450;
const INTRO = `Eat apples together for one shared score.<br>
  Crash and you're back in 3s — or instantly when your teammate eats an apple.<br>
  Eat within a moment of each other for a 🤝 teamwork bonus!`;

// Helpers for checking untrusted values (saved settings, and everything that comes over the network)
const has = (o, k) => typeof k === 'string' && Object.prototype.hasOwnProperty.call(o, k);
const num = (v, lo, hi, dflt = lo) => Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : dflt;
const int = (v, lo, hi) => Math.round(num(v, lo, hi));
const arr = (v, max) => Array.isArray(v) ? v.slice(0, max) : [];
const isIdx = (v, len) => Number.isInteger(v) && v >= 0 && v < len;

const DEFAULT_CFG = { speed:'normal', apples:2, board:'medium', mode:'walls', game:'classic' };
// Only ever accept known setting values (from storage or from an online host)
function validCfg(c) {
  c = c && typeof c === 'object' ? c : {};
  return {
    speed: has(SPEEDS, c.speed) ? c.speed : DEFAULT_CFG.speed,
    apples: [1, 2, 3, 5].includes(c.apples) ? c.apples : DEFAULT_CFG.apples,
    board: has(BOARDS, c.board) ? c.board : DEFAULT_CFG.board,
    mode: c.mode === 'wrap' ? 'wrap' : 'walls',
    game: has(GAMES, c.game) ? c.game : DEFAULT_CFG.game,
  };
}
function loadCfg() {
  try { return validCfg(JSON.parse(localStorage.getItem('coopSnakeCfg') || '{}')); } catch (e) { return validCfg({}); }
}
let cfg = loadCfg();
let COLS, ROWS, TICK, RESPAWN_TICKS;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const dpr = Math.max(1, window.devicePixelRatio || 1);
const $ = id => document.getElementById(id);
const overlay = $('overlay');

let snakes, apples, rocks = [], score, best = 0, bestAtStart = 0, goldCounter = 0, tickNo = 0;
let stats = { rescues:0, teamwork:0, longest:0 }, lastEat = [-99, -99];
let state = 'ready', lastTick = 0, pausedT = 0, countEnd = 0, lastCount = 0, overAt = 0;
let particles = [], popups = [], shake = 0, frameK = 1;
let muted = false;
try { muted = localStorage.getItem('coopSnakeMuted') === '1'; } catch (e) {}
const rockBorn = new Map();
// Per-player looks that only exist on screen (mouth, blinking, emote bubbles)
const looks = [0, 1, 2, 3].map(() => ({ mouth:0, blinkAt:0, emote:-1, emoteAt:0, lastEmote:-1e9, hx:0, hy:0 }));

// Saved snake looks: one for each local player, plus "mine" for online games
function loadSkins() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('coopSnakeSkins') || '{}') || {}; } catch (e) {}
  const local = Array.isArray(saved.local) ? saved.local : [];
  return { local: [validSkin(local[0], DEFAULT_SKINS[0]), validSkin(local[1], DEFAULT_SKINS[1])], online: validSkin(saved.online, DEFAULT_SKINS[0]) };
}
const savedSkins = loadSkins();
const copySkins = () => DEFAULT_SKINS.map(k => ({ ...k }));
// The looks in the current game, one per player slot
function startingSkins() {
  const k = copySkins();
  if (uiMode === 'local') { k[0] = { ...savedSkins.local[0] }; k[1] = { ...savedSkins.local[1] }; }
  else if (role !== 'guest') k[0] = { ...savedSkins.online };
  return k;
}
let skins = copySkins();
const saveSkins = () => { try { localStorage.setItem('coopSnakeSkins', JSON.stringify(savedSkins)); } catch (e) {} };
const skinHex = id => PALETTE[skins[id].c].hex;
const skinDead = id => mix(skinHex(id), '#a3a8b0', .6);
// Online, players might pick the same color: earlier slots keep theirs, later ones move to the next free color
function fixClash() {
  const used = new Set();
  skins.forEach((k, i) => {
    let c = k.c;
    while (used.has(c)) c = (c + 1) % PALETTE.length;
    used.add(c);
    if (c !== k.c) skins[i] = { ...k, c };
  });
}

// Online: 'local' = same keyboard, 'host' runs the game, 'guest' mirrors the host.
// The host is player slot 0; up to three friends get slots 1–3.
let uiMode = 'local', role = 'local', peer = null, conn = null, roomCode = '', mySlot = 1;
const conns = {};      // host: slot -> that friend's connection
const lastSeq = {};    // host: slot -> newest key press received from that friend
const pings = {};      // host: slot -> that friend's connection delay
let recording = false, outFx = [], inputSeq = 0, unacked = [], forceOverlay = false;
let inbox = [], applyAt = 0, lastN = -1, pingMs = null;
const PEER_PREFIX = 'coop-snake-v4-';

const bestKey = () => `coopSnakeBest:${cfg.speed}-${cfg.apples}-${cfg.board}-${cfg.mode}-${cfg.game}`;
const maxRewind = () => Math.max(2, Math.ceil(REWIND_MS / TICK));
const eq = (a, b) => a.x === b.x && a.y === b.y;
const inBounds = p => p.x >= 0 && p.y >= 0 && p.x < COLS && p.y < ROWS;
const rand = (a, b) => a + Math.random() * (b - a);

function step(p, dir) {
  const d = DIRS[dir];
  let x = p.x + d.x, y = p.y + d.y;
  if (cfg.mode === 'wrap') { x = (x + COLS) % COLS; y = (y + ROWS) % ROWS; }
  return { x, y };
}

// Portal mode: two pairs of portals; portals[i] is linked to portals[i ^ 1]
let portals = [];
const PORTAL_COLORS = ['#ff9f1c', '#2ec4f1'];
const portalAt = p => portals.findIndex(q => eq(q, p));
// Where a move from p in `dir` really ends up (stepping into a portal pops you out of its twin)
function dest(p, dir) {
  const n = step(p, dir), i = portalAt(n);
  return i < 0 ? n : { ...portals[i ^ 1] };
}
// Are two body squares next to each other (counting wrap-around edges)?
function touching(a, c) {
  let dx = Math.abs(a.x - c.x), dy = Math.abs(a.y - c.y);
  if (cfg.mode === 'wrap') { dx = Math.min(dx, COLS - dx); dy = Math.min(dy, ROWS - dy); }
  return dx + dy === 1;
}
// For drawing: from body square `older`, which square does the body head toward? Usually `newer`,
// but if the snake went through a portal there, it's the entrance portal next to `older`.
function linkNext(older, newer) {
  if (touching(older, newer)) return newer;
  const i = portalAt(newer);
  return i >= 0 && touching(older, portals[i ^ 1]) ? portals[i ^ 1] : newer;
}

// Move t of the way from a toward b, taking the short way across a wrapped edge.
function toward(a, b, t) {
  let dx = b.x - a.x, dy = b.y - a.y;
  if (Math.abs(dx) > 1) dx = -Math.sign(dx);
  if (Math.abs(dy) > 1) dy = -Math.sign(dy);
  return { x: a.x + dx * t, y: a.y + dy * t };
}

function hintText() {
  if (cfg.game === 'peaceful') return 'Shared score · Peaceful mode: nobody can crash — pause to end the game';
  if (cfg.game === 'poison') return 'Shared score · Skip the dark ☠ apples — they knock you out';
  if (cfg.game === 'portal') return 'Shared score · Portals connect in matching colors — use them to cross the board';
  if (cfg.game === 'speed') return 'Shared score · Every point makes you faster';
  if (cfg.game === 'maze') return `Shared score · Every apple drops a rock — dodge the rocks${cfg.mode === 'wrap' ? '' : ', the walls'} and each other`;
  return cfg.mode === 'wrap' ? "Shared score · Don't run into yourself or your teammate"
                             : "Shared score · Don't run into walls, yourself, or your teammate";
}

function applyConfig() {
  [COLS, ROWS] = BOARDS[cfg.board];
  TICK = SPEEDS[cfg.speed];
  RESPAWN_TICKS = Math.round(3000 / TICK);
  canvas.width = COLS * CELL * dpr; canvas.height = ROWS * CELL * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  document.querySelectorAll('.seg[data-key]').forEach(seg => {
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === String(cfg[seg.dataset.key])));
  });
  $('modeDesc').textContent = GAMES[cfg.game];
  $('hint').textContent = hintText();
  try { best = +localStorage.getItem(bestKey()) || 0; } catch (e) { best = 0; }
  $('best').textContent = best;
  fit();
}

// Size the board to fit the window (and fill the screen in fullscreen)
function fit() {
  if (!COLS) return;
  const fs = !!document.fullscreenElement;
  const bar = $('emoteBar').hidden ? 0 : 52;
  const chrome = $('hud').offsetHeight + $('hint').offsetHeight + bar + 28 + 40;
  const byHeight = (innerHeight - chrome) * COLS / ROWS + 28;
  $('wrap').style.width = Math.round(Math.max(280, Math.min(innerWidth * .94, fs ? 1800 : 680, byHeight))) + 'px';
}
addEventListener('resize', fit);
document.addEventListener('fullscreenchange', fit);

// Which player slots get a snake: two on one keyboard, or online the host plus every connected friend
function playerSlots() {
  if (role !== 'host') return [0, 1];
  return [0, ...Object.keys(conns).map(Number).filter(i => conns[i].open).sort()];
}
const snakeOf = id => snakes.find(s => s.id === id);

function makeSnake(id, y) {
  const body = [{x:4,y},{x:3,y},{x:2,y},{x:1,y}];
  return { id, body, dir:'right', queue:[], alive:true, respawn:0, apples:0, pending:0, eatFx:0, blocked:false, log:[], moves:0 };
}

function reset() {
  applyConfig();
  // Everyone starts on the left, spread out over the rows
  const ids = playerSlots();
  const rows = ids.length === 2 ? [Math.floor(ROWS * .3), ROWS - 1 - Math.floor(ROWS * .3)]
                                : ids.map((_, i) => Math.floor((i + .5) * ROWS / ids.length));
  snakes = ids.map((id, i) => makeSnake(id, rows[i]));
  rocks = []; rockBorn.clear(); portals = [];
  apples = rows.slice(0, 2).map(y => ({ x: COLS - 5, y })).slice(0, cfg.apples);
  if (cfg.game === 'portal') placePortals(rows);
  while (normalApples() < cfg.apples) spawnApple();
  if (cfg.game === 'poison') movePoison();
  score = 0; goldCounter = 0; tickNo = 0; lastEat = [-99, -99];
  stats = { rescues:0, teamwork:0, longest:4 };
  particles = []; popups = []; shake = 0;
  updateHud();
}

function occupied() {
  const cells = [];
  snakes.forEach(s => s.alive && cells.push(...s.body));
  return cells.concat(apples, rocks, portals);
}

const normalApples = () => apples.filter(a => !a.gold && !a.poison).length;

// Portal mode: two linked pairs, kept away from the starting rows, the edges and each other
function placePortals(rows) {
  for (let tries = 0; tries < 2000 && portals.length < 4; tries++) {
    const p = { x: 1 + (Math.random() * (COLS - 2) | 0), y: 1 + (Math.random() * (ROWS - 2) | 0) };
    if (rows.includes(p.y) || occupied().some(c => eq(c, p))) continue;
    if (portals.some(q => Math.abs(q.x - p.x) + Math.abs(q.y - p.y) < 4)) continue;
    portals.push(p);
  }
  if (portals.length < 4) portals = [];
}

// Poison mode: as many poison apples as real ones, and they all move whenever an apple is eaten
function movePoison() {
  apples = apples.filter(a => !a.poison);
  for (let i = 0; i < cfg.apples; i++) spawnApple('poison');
}

function spawnApple(kind) {
  const gold = kind === true || kind === 'gold';
  const occ = occupied();
  // Poison never lands right next to a snake's head, so you always get a fair chance to dodge it
  const nearHead = c => kind === 'poison' && snakes.some(s => s.alive && Math.abs(s.body[0].x - c.x) <= 2 && Math.abs(s.body[0].y - c.y) <= 2);
  const free = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++)
    if (!occ.some(c => c.x === x && c.y === y) && !nearHead({ x, y })) free.push({x,y});
  if (!free.length) return;
  const a = free[Math.random() * free.length | 0];
  if (gold) { a.gold = true; a.ttl = Math.round(GOLD_MS / TICK); a.max = a.ttl; }
  if (kind === 'poison') a.poison = true;
  apples.push(a);
  if (gold) { burst(a, '#ffd54a', 14, 2.5); beep(1046, .08); beep(1568, .12, .07); }
}

// Maze mode: drop a rock somewhere that isn't right next to or in front of a snake
function spawnRock() {
  if (rocks.length >= Math.floor(COLS * ROWS * ROCK_MAX)) return;
  const occ = occupied();
  const heads = snakes.filter(s => s.alive).map(s => ({ h: s.body[0], dir: nextDir(s) }));
  const tooClose = c => heads.some(({ h, dir }) => {
    if (Math.abs(h.x - c.x) <= 2 && Math.abs(h.y - c.y) <= 2) return true;
    for (let i = 0, p = h; i < 6; i++) { p = step(p, dir); if (eq(p, c)) return true; }
    return false;
  });
  const free = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = { x, y };
    if (!occ.some(o => eq(o, c)) && !tooClose(c)) free.push(c);
  }
  if (!free.length) return;
  const r = free[Math.random() * free.length | 0];
  rocks.push(r);
  burst(r, '#8a8f98', 10, 2.5);
  beep(110, .12, 0, 'triangle');
}

function respawnSnake(s) {
  const occ = occupied();
  const isFree = p => inBounds(p) && !occ.some(c => eq(c, p));
  for (let tries = 0; tries < 500; tries++) {
    const x = 3 + (Math.random() * Math.max(1, COLS - 6) | 0), y = Math.random() * ROWS | 0;
    const dir = x < COLS / 2 ? 'right' : 'left', d = DIRS[dir];
    const body = [0,1,2].map(i => ({ x: x - d.x * i, y }));
    const ahead = [1,2,3].map(i => ({ x: x + d.x * i, y }));
    if (body.every(isFree) && ahead.every(isFree)) {
      Object.assign(s, { body, dir, queue:[], alive:true, respawn:0, pending:0, eatFx:1, blocked:false, log:[], fresh:true, moves:0 });
      burst(body[0], skinHex(s.id), 16, 3);
      beep(520, .08); beep(780, .1, .08);
      return true;
    }
  }
  return false;
}

// ---------- Game logic (runs on local games and on the online host) ----------
function tick() {
  recording = true;
  tickNo++;
  const peaceful = cfg.game === 'peaceful';
  snakes.forEach(s => { s.fresh = false; s.ateNow = false; });
  snakes.forEach(s => { if (!s.alive && s.respawn > 0 && --s.respawn === 0 && !respawnSnake(s)) s.respawn = 1; });

  apples.forEach(a => { if (a.gold) a.ttl--; });
  apples.filter(a => a.gold && a.ttl <= 0).forEach(a => burst(a, '#ffd54a', 8, 1.5));
  apples = apples.filter(a => !a.gold || a.ttl > 0);

  const live = snakes.filter(s => s.alive);
  for (const s of live) {
    const was = s.dir;
    if (s.queue.length) s.dir = s.queue.shift();
    s.turned = s.dir !== was;
    const next = dest(s.body[0], s.dir);
    s.next = null;
    const gate = portalAt(step(s.body[0], s.dir));
    if (gate >= 0) { // whoosh through a portal
      burst(portals[gate], PORTAL_COLORS[gate >> 1], 10, 2.5); burst(portals[gate ^ 1], PORTAL_COLORS[gate >> 1], 10, 2.5);
      beep(600, .06, 0, 'sine'); beep(900, .08, .05, 'sine');
    }
    if (peaceful && !inBounds(next)) { // Peaceful: walls just stop you
      if (!s.blocked) beep(220, .07, 0, 'triangle');
      s.blocked = true;
      continue;
    }
    s.blocked = false;
    s.next = next;
    s.appleIdx = apples.findIndex(a => eq(a, next));
    s.oldBody = s.body.slice(); s.oldPending = s.pending;
  }
  const movers = live.filter(s => s.next);
  for (const s of movers) {
    s.body.unshift(s.next); s.moves++;
    if (s.pending > 0) { s.pending--; s.popped = null; } else s.popped = s.body.pop();
  }
  const dying = peaceful ? [] : movers.filter(s => {
    const h = s.body[0];
    return !inBounds(h)
      || rocks.some(r => eq(r, h))
      || (s.appleIdx >= 0 && apples[s.appleIdx].poison)
      || s.body.some((c, i) => i > 0 && eq(c, h))
      || live.some(o => o !== s && o.body.some(c => eq(c, h)));
  });
  for (const s of dying) {
    s.alive = false; s.body = s.oldBody; s.pending = s.oldPending; s.queue = []; s.log = [];
    s.respawn = RESPAWN_TICKS;
    burst(s.body[0], skinHex(s.id), 22, 4);
    doShake();
  }
  if (dying.length) beep(160, .25, 0, 'sawtooth');

  const eaten = new Set();
  for (const s of movers) {
    if (!s.alive || s.appleIdx < 0 || eaten.has(s.appleIdx)) continue;
    eaten.add(s.appleIdx); s.ateNow = true;
    eatApple(s, apples[s.appleIdx]);
  }
  if (eaten.size) {
    apples = apples.filter((_, i) => !eaten.has(i));
    refillAfterEating(eaten.size);
  }
  // Remember each snake's last few moves, so a late key press from an online friend can still count
  for (const s of live) {
    if (!s.alive || s.fresh) { s.log = []; continue; }
    s.log.unshift(s.next ? { tail:s.popped, turn:s.turned, ate:s.ateNow, ok:!dying.length }
                         : { tail:null, turn:false, ate:false, ok:false });
    if (s.log.length > maxRewind()) s.log.length = maxRewind();
  }
  stats.longest = Math.max(stats.longest, ...snakes.map(s => s.body.length));
  recording = false;

  if (!snakes.some(s => s.alive)) gameOver();
  updateHud();
  sendState();
}

function eatApple(s, a) {
  const pts = a.gold ? GOLD_POINTS : 1;
  s.apples += pts; score += pts; s.pending += a.gold ? GOLD_GROW : 1; s.eatFx = 1;
  burst(a, a.gold ? '#ffd54a' : '#e7471d', a.gold ? 24 : 12, a.gold ? 4 : 3);
  popup(a, '+' + pts, a.gold ? '#ffe680' : '#fff');
  if (a.gold) { beep(880, .06); beep(1175, .06, .06); beep(1568, .1, .12); }
  else { beep(880, .06); beep(1320, .07, .05); if (++goldCounter >= GOLD_EVERY) goldCounter = -1; }
  // Teamwork bonus: you and a teammate eat within a moment of each other
  if (snakes.some(o => o !== s && tickNo - (lastEat[o.id] ?? -99) <= Math.round(TEAM_MS / TICK))) {
    score += TEAM_BONUS; stats.teamwork++; lastEat = [];
    popup({ x:a.x, y:a.y - .7 }, 'Teamwork +' + TEAM_BONUS, '#ffe680');
    beep(1320, .08, .12, 'triangle'); beep(1760, .14, .2, 'triangle');
  } else lastEat[s.id] = tickNo;
  // Co-op rescue: eating brings back the downed teammate with the longest wait left
  const mate = snakes.filter(o => !o.alive && o.respawn > 0).sort((p, q) => q.respawn - p.respawn)[0];
  if (mate && respawnSnake(mate)) {
    stats.rescues++;
    popup(mate.body[0], 'Rescued!', '#fff');
  }
}

function refillAfterEating(count) {
  while (normalApples() < cfg.apples) spawnApple();
  if (goldCounter === -1) { goldCounter = 0; if (!apples.some(a => a.gold)) spawnApple(true); }
  if (cfg.game === 'maze') for (let i = 0; i < count; i++) spawnRock();
  if (cfg.game === 'poison') movePoison();
  if (cfg.game === 'speed') {
    // 4% faster per point, down to a limit
    TICK = Math.min(TICK, Math.max(55, Math.round(SPEEDS[cfg.speed] * Math.pow(.96, score))));
  }
}

// ---------- Turning ----------
// How far (0–1) the snakes are through the current move, as drawn on screen
const stepT = () => state === 'playing' ? Math.max(0, Math.min(1, (performance.now() - lastTick) / TICK)) : 0;

// Would moving `dir` next stop or kill snake s? Its head is held back instead of sliding into trouble.
function aheadBlocked(s, dir) {
  const b = s.body, next = dest(b[0], dir);
  if (!inBounds(next) || rocks.some(r => eq(r, next)) || apples.some(a => a.poison && eq(a, next))) return true;
  if (cfg.game === 'peaceful') return false;
  // A tail is safe to follow, since it moves out of the way on the same step (unless that snake is growing)
  const hits = o => o.body.some((c, i) => eq(c, next) && (o.pending > 0 || i < o.body.length - 1));
  return hits(s) || snakes.some(o => o !== s && o.alive && hits(o));
}

// Which move a new key press turns on: the square the head is drawn in. Once the head is more than
// halfway into the next square, the turn happens there instead of snapping the head back.
function turnMove(s, n) {
  const late = !s.queue.length && stepT() >= .5 && !aheadBlocked(s, s.dir);
  return n + 1 + s.queue.length + (late ? 1 : 0);
}

// Queue a turn for move number `at` (n = the last move made), going straight until then
function queueAt(s, dir, at, n) {
  const last = s.queue.length ? s.queue[s.queue.length - 1] : s.dir;
  if (dir === last || dir === OPP[last]) return false;
  while (s.queue.length < 2 && n + 1 + s.queue.length < at) s.queue.push(last);
  if (s.queue.length >= 3) return false;
  s.queue.push(dir);
  return true;
}

// Bodies a snake had at the end of each of its last k moves, newest first
// (null where it had only just come back to life, or null overall if we can't tell)
function pastBodies(s, k) {
  const out = [s.body];
  let b = s.body;
  for (let i = 0; i < k - 1; i++) {
    const r = s.log[i];
    if (!r) { while (out.length < k) out.push(null); break; }
    if (!r.ok) return null;
    b = b.slice(1);
    if (r.tail) b.push(r.tail);
    out.push(b);
  }
  return out;
}

// Online lag fix: redo snake s's last k moves as if it had turned to `dir` k moves ago.
// The host does this when the friend's key press arrives late, and the friend's game uses the same
// rules to show it straight away, so their snake turns exactly where they pressed.
// Returns null if that wouldn't be safe (then the turn just happens on the next move instead).
function replayTurn(s, k, dir) {
  if (!s.alive || s.queue.length || k < 1 || k > s.log.length) return null;
  if (dir === s.dir || dir === OPP[s.dir]) return null;
  const recent = s.log.slice(0, k);
  if (!recent.every(r => r.ok && !r.turn && !r.ate)) return null;
  const peaceful = cfg.game === 'peaceful';
  // Where every teammate was during those moves
  const mates = peaceful ? [] : snakes.filter(o => o !== s && o.alive).map(o => pastBodies(o, k));
  if (mates.includes(null)) return null;
  let body = s.body;
  for (const r of recent) { body = body.slice(1); if (r.tail) body.push(r.tail); }
  const log = [];
  let eat = false;
  for (let j = k - 1; j >= 0; j--) {
    const head = dest(body[0], dir);
    if (!inBounds(head) || rocks.some(c => eq(c, head))) return null;
    body = [head, ...body];
    const tail = recent[j].tail ? body.pop() : null;
    if (!peaceful) {
      if (body.some((c, i) => i > 0 && eq(c, head))) return null;
      for (const m of mates) {
        const ob = m[j];
        if (ob && (ob.some(c => eq(c, head)) || body.some(c => eq(c, ob[0])))) return null;
      }
    }
    const apple = apples.find(a => eq(a, head));
    if (apple) { if (j > 0 || apple.poison) return null; eat = true; }
    log.unshift({ tail, turn: j === k - 1, ate: false, ok: true });
  }
  return { body, log: log.concat(s.log.slice(k)), eat };
}

// Host: the friend's turn was meant for a move that already happened
function lateTurn(slot, dir, at) {
  const s = snakeOf(slot), k = tickNo - at + 1;
  if (!s || k > maxRewind()) return false;
  const r = replayTurn(s, k, dir);
  if (!r) return false;
  s.body = r.body; s.dir = dir; s.log = r.log;
  const i = r.eat ? apples.findIndex(a => eq(a, s.body[0])) : -1;
  if (i >= 0) {
    recording = true;
    eatApple(s, apples.splice(i, 1)[0]);
    s.log[0].ate = true;
    refillAfterEating(1);
    recording = false;
  }
  updateHud();
  sendState();
  return true;
}

function updateHud() {
  $('score').textContent = score;
  for (let id = 0; id < MAX_PLAYERS; id++) {
    const s = snakeOf(id);
    $('pl' + (id + 1)).hidden = !s;
    if (!s) continue;
    const down = !s.alive && state !== 'over';
    $('p' + (id + 1)).textContent = s.gone ? `${s.apples} · left` : down ? `${s.apples} · back in ${Math.ceil(s.respawn * TICK / 1000)}s` : s.apples;
    $('pl' + (id + 1)).classList.toggle('down', down);
  }
  // Someone who joins in the middle of a round watches until the next one
  const mine = snakeOf(mySlot);
  if (role === 'guest') $('hint').textContent = (!mine || mine.gone) && state !== 'ready' ? "👀 Watching — you'll join at the next round" : hintText();
  if (score > best) {
    best = score; $('best').textContent = best;
    try { localStorage.setItem(bestKey(), best); } catch (e) {}
  }
}

// ---------- Flow ----------
function beginGame() {
  reset();
  bestAtStart = best;
  state = 'countdown'; countEnd = performance.now() + 1800; lastCount = 0;
  overlay.classList.add('hidden');
  sendState();
}

function resume() {
  lastTick = performance.now() - pausedT * TICK;
  state = 'playing';
  overlay.classList.add('hidden');
  sendState();
}

function showOverlay(title, html, button, paused) {
  $('ovTitle').textContent = title;
  $('ovText').innerHTML = html;
  $('play').textContent = button;
  overlay.classList.toggle('paused', !!paused);
  overlay.classList.remove('hidden');
  renderMenu();
}

function showIntro() { showOverlay('Co-op Snake', INTRO, role === 'guest' ? 'Start' : 'Play'); }

function showGameOver() {
  const isBest = score > 0 && score > bestAtStart;
  const secs = Math.round(tickNo * TICK / 1000);
  const time = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
  showOverlay(isBest ? 'New best! 🏆' : cfg.game === 'peaceful' ? 'Well played!' : 'Game over',
    `You scored <b>${score}</b> together!<br>${snakes.map(s => `${playerName(s.id)}: ${s.apples}`).join(' · ')}
     <span class="stats"><span>⏱ ${time}</span><span>📏 Longest ${stats.longest}</span>
     <span>🛟 Rescues ${stats.rescues}</span><span>🤝 Teamwork ${stats.teamwork}</span></span>`,
    'Play again');
}

function gameOver() { state = 'over'; overAt = performance.now(); showGameOver(); sendState(); }
function endGame() { if (state === 'playing' || state === 'paused') gameOver(); }

function togglePause() {
  if (state === 'playing') {
    pausedT = Math.min(1, (performance.now() - lastTick) / TICK);
    state = 'paused';
    showOverlay('Paused', 'Press Space to resume', 'Resume', true);
    sendState();
  } else if (state === 'paused') resume();
}

// A local game pauses itself when you switch away (online games keep going, since your friend is still playing)
const awayFromGame = () => document.hidden;
const pauseIfAway = () => { if (role === 'local' && state === 'playing') togglePause(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseIfAway(); });
addEventListener('blur', pauseIfAway);

// Stops a new game starting by accident while you're still mashing keys after a crash
const canRestart = () => state !== 'over' || performance.now() - overAt > 700;

function spaceAction() {
  if (state === 'playing' || state === 'paused') togglePause();
  else if (state === 'ready' || (state === 'over' && canRestart())) beginGame();
}

function steer(player, dir) {
  if (state === 'ready' || state === 'over') { if (!canRestart()) return; beginGame(); }
  if (state !== 'playing' && state !== 'countdown') return;
  const s = snakeOf(player);
  if (s && s.alive) queueAt(s, dir, turnMove(s, tickNo), tickNo);
}

// ---------- Input (keyboard, touch, controllers, buttons) ----------
const me = () => role === 'guest' ? mySlot : 0;
const friendCount = () => Object.values(conns).filter(c => c.open).length;
const connected = () => role === 'host' ? friendCount() > 0 : !!(conn && conn.open);

function playerSteer(p, dir) {
  if (role === 'guest') guestSteer(dir);
  else if (role === 'host') { if (connected()) steer(0, dir); }
  else if (uiMode === 'local') steer(p, dir);
}

function pressPause() {
  if (role === 'guest') { if (connected()) send({ t:'space' }); return; }
  if (uiMode === 'online' && !connected()) return;
  spaceAction();
}

function pressStart() {
  if (role === 'guest') { if (connected()) send({ t:'start' }); return; }
  if (uiMode === 'online' && !connected()) return;
  if (state === 'paused') resume();
  else if (state === 'ready' || state === 'over') beginGame();
}

function pressQuit() {
  if (role === 'guest') { if (connected()) send({ t:'quit' }); return; }
  endGame();
}

function showEmote(p, i) {
  const now = performance.now(), L = looks[p];
  if (now - L.lastEmote < 450) return false; // no spamming
  L.lastEmote = now; L.emote = i; L.emoteAt = now;
  beep(1100 + i * 90, .05, 0, 'sine');
  return true;
}

function pressEmote(p, i) {
  if (role === 'guest') { if (connected() && showEmote(mySlot, i)) send({ t:'emote', i }); }
  else if (role === 'host') { if (connected() && showEmote(0, i)) send({ t:'emote', p:0, i }); }
  else if (uiMode === 'local') showEmote(p, i);
}

function toggleMute() {
  muted = !muted;
  try { localStorage.setItem('coopSnakeMuted', muted ? '1' : '0'); } catch (e) {}
  $('muteBtn').textContent = muted ? '🔇' : '🔊';
}

function toggleFullscreen() {
  if (!document.fullscreenEnabled) return;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen().catch(() => {});
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') {
    if (e.key === 'Enter') joinGame($('codeIn').value);
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const m = KEYMAP[e.code], em = EMOTE_KEYS[e.code];
  if (m || e.code === 'Space') e.preventDefault();
  if (e.code === 'KeyM') return toggleMute();
  if (e.code === 'KeyF') return toggleFullscreen();
  if (e.code === 'Space' || e.code === 'Enter') return pressPause();
  if (e.code === 'KeyP' || e.code === 'Escape') { if (state === 'playing' || state === 'paused') pressPause(); return; }
  if (em) return pressEmote(em[0], em[1]);
  if (m) playerSteer(m[0], m[1]);
});

$('play').addEventListener('click', e => { e.currentTarget.blur(); pressStart(); });
$('quit').addEventListener('click', e => { e.currentTarget.blur(); pressQuit(); });
$('muteBtn').addEventListener('click', e => { e.currentTarget.blur(); toggleMute(); });
$('fsBtn').addEventListener('click', e => { e.currentTarget.blur(); toggleFullscreen(); });
$('fsBtn').hidden = !document.fullscreenEnabled;
$('emoteBar').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  b.blur();
  pressEmote(me(), +b.dataset.e);
});

document.querySelectorAll('.seg[data-key]').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || role === 'guest') return;
  b.blur();
  const k = seg.dataset.key;
  cfg = validCfg({ ...cfg, [k]: k === 'apples' ? +b.dataset.v : b.dataset.v });
  try { localStorage.setItem('coopSnakeCfg', JSON.stringify(cfg)); } catch (err) {}
  reset();
  sendState();
}));

// Touch: local = left half P1 / right half P2; online = anywhere steers your own snake
const touches = {};
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) touches[t.identifier] = { x: t.clientX, y: t.clientY, p: t.clientX < innerWidth / 2 ? 0 : 1 };
}, { passive:false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const s = touches[t.identifier];
    if (!s) continue;
    const dx = t.clientX - s.x, dy = t.clientY - s.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) continue;
    playerSteer(s.p, Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    s.x = t.clientX; s.y = t.clientY;
  }
}, { passive:false });
canvas.addEventListener('touchend', e => { for (const t of e.changedTouches) delete touches[t.identifier]; });

// Controllers: first pad is P1 and second is P2 (online, any pad steers you).
// D-pad or left stick steers, Start pauses, A starts/resumes, A/B/X/Y send emotes while playing.
const padPrev = {};
let padsSeen = false;
addEventListener('gamepadconnected', () => { padsSeen = true; });
function pollPads() {
  if (!padsSeen || !navigator.getGamepads) return;
  let pads;
  try { pads = [...navigator.getGamepads()].filter(p => p && p.connected); } catch (e) { return; }
  pads.forEach((p, order) => {
    const prev = padPrev[p.index] || (padPrev[p.index] = { dir:null, btn:[] });
    const player = role === 'local' ? Math.min(order, 1) : me();
    const down = i => !!(p.buttons[i] && p.buttons[i].pressed);
    let dir = down(12) ? 'up' : down(13) ? 'down' : down(14) ? 'left' : down(15) ? 'right' : null;
    if (!dir) {
      const x = p.axes[0] || 0, y = p.axes[1] || 0, ax = Math.abs(x), ay = Math.abs(y);
      // Near a diagonal, keep the previous direction so a wobbly stick doesn't flip back and forth
      if (Math.max(ax, ay) > .5) dir = Math.abs(ax - ay) < .2 ? prev.dir : ax > ay ? (x > 0 ? 'right' : 'left') : (y > 0 ? 'down' : 'up');
    }
    if (dir && dir !== prev.dir) playerSteer(player, dir);
    prev.dir = dir;
    const pressed = i => down(i) && !prev.btn[i];
    if (pressed(9)) pressPause();
    for (let i = 0; i < 4; i++) if (pressed(i)) {
      if (state === 'playing' || state === 'countdown') pressEmote(player, i);
      else if (i === 0 && canRestart()) pressStart();
    }
    prev.btn = p.buttons.map(b => b.pressed);
  });
}

// ---------- Online ----------
function playerName(i) {
  if (role === 'local') return 'P' + (i + 1);
  return i === me() ? 'You' : 'P' + (i + 1);
}
function setStatus(html) { $('onStatus').innerHTML = html; }
// Guest: message the host. Host: message every friend (or `except` one of them).
function send(m, except) {
  if (role === 'host') { for (const [slot, c] of Object.entries(conns)) if (+slot !== except) sendTo(c, m); }
  else if (conn && conn.open) sendTo(conn, m);
}
function sendTo(c, m) { if (c && c.open) { try { c.send(m); } catch (e) {} } }
const youAre = () => `<span class="dot" style="background:var(--p${me() + 1})"></span> You are <b>${PALETTE[skins[me()].c].name}</b>`;

// Show the current looks in the top bar and menu
function applySkins() {
  skins.forEach((k, i) => document.documentElement.style.setProperty('--p' + (i + 1), PALETTE[k.c].hex));
  renderMenu();
}

function renderSkinPanel() {
  const panel = $('skinPanel');

        style="background:${c.hex}" title="${c.name}" aria-label="${c.name}"${taken === i ? ' disabled' : ''}></button>`).join('')}</div>
      <div class="seg">${Object.entries(PATTERNS).map(([p, name]) =>
        `<button data-slot="${slot}" data-pat="${p}" class="${k.p === p ? 'on' : ''}">${name}</button>`).join('')}</div></div>`;
  }).join('');
}

function setSkin(slot, k) {
  skins[slot] = k;

  else {
    savedSkins.online = k;
    if (role === 'host') { fixClash(); sendState(); }
    else if (role === 'guest') send({ t:'skin', c:k.c, p:k.p });
  }

}

$('skinBtn').addEventListener('click', e => {

function renderMenu() {
  const online = uiMode === 'online', on = connected();
  $('modeSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mode === uiMode));
  $('onlinePanel').hidden = !online;

       <div><span class="dot" style="background:var(--p2)"></span><b>P2</b> Arrow keys · emotes 7–0</div>`;
  const common = 'Space pause · M mute · F fullscreen · 🎮 controllers work too';
  $('help').innerHTML = !online ? `Any movement key starts · ${common}<br>Touch: swipe on the left half for P1, right half for P2`
    : role === 'guest' ? `The host picks the settings · ${common}`
